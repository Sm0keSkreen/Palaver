<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palaver</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#080b11}
iframe{display:block;width:100%;height:100%;border:0}
#boot-status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#9fb3c8;font:14px system-ui,-apple-system,sans-serif;background:#080b11;text-align:center;padding:24px;box-sizing:border-box}
</style>
</head>
<body>
<div id="boot-status">Loading Palaver…</div>
<script>
(function(){
var REPO='Sm0keSkreen/Palaver',FILE='palaver-app.html',
FB='https://cdn.jsdelivr.net/gh/'+REPO+'@main/'+FILE,
el=document.getElementById('boot-status');
function render(h){var f=document.createElement('iframe');f.title='Palaver \u2014 offline AI chat';f.setAttribute('allow','clipboard-read; clipboard-write');f.srcdoc=h;document.body.innerHTML='';document.body.appendChild(f)}
function load(u){return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})}
fetch('https://api.github.com/repos/'+REPO+'/commits/main',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('GitHub API '+r.status);return r.json()}).then(function(c){if(!c.sha)throw new Error('no sha');return load('https://cdn.jsdelivr.net/gh/'+REPO+'@'+c.sha+'/'+FILE)}).catch(function(){return load(FB)}).then(render).catch(function(e){el.textContent='Failed to load Palaver: '+e.message+'\n\nDirect link: '+FB});
})();
</script>
</body>
</html>
