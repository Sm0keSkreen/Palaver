<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Palaver, offline AI chat</title>
<style>
:root{
  /* Midnight (default): deep navy, monochrome blue, same palette as Emend */
  --bg:#080b11;
  --panel:#0d121a;
  --panel-2:#111826;
  --border:#1c2432;
  --text:#dde3ee;
  --text-dim:#78839a;
  --accent:#3e82f7;
  --accent-hover:#2f6fe0;
  --accent-soft:rgba(62,130,247,.14);
  --user-bubble:#1a2740;
  --assistant-bubble:#111826;
  --radius:8px;
  --font-ui:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:14.5px;
}

:root[data-theme="nord"]{
  --bg:#2e3440;
  --panel:#333a48;
  --panel-2:#3b4252;
  --border:#4c566a;
  --text:#eceff4;
  --text-dim:#9aa5b8;
  --accent:#5e81ac;
  --accent-hover:#81a1c1;
  --accent-soft:rgba(94,129,172,.2);
  --user-bubble:#434c5e;
  --assistant-bubble:#3b4252;
}

:root[data-theme="ocean"]{
  --bg:#0d1117;
  --panel:#111823;
  --panel-2:#161d29;
  --border:#21262d;
  --text:#e6edf3;
  --text-dim:#7d8590;
  --accent:#388bfd;
  --accent-hover:#58a6ff;
  --accent-soft:rgba(56,139,253,.15);
  --user-bubble:#1c2836;
  --assistant-bubble:#161d29;
}

:root[data-theme="sky"]{
  --bg:#f2f6fc;
  --panel:#ffffff;
  --panel-2:#edf2fa;
  --border:#d7e3f0;
  --text:#12203a;
  --text-dim:#5b6b82;
  --accent:#2f7de9;
  --accent-hover:#1d63c9;
  --accent-soft:rgba(47,125,233,.1);
  --user-bubble:#dce8fb;
  --assistant-bubble:#ffffff;
  color-scheme:light;
}

html{color-scheme:dark;}

::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim);}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
}
#app{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:row;
  position:relative;
}

/* ---------- Sidebar ---------- */
.sidebar{
  width:260px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  background:var(--panel);
  border-right:1px solid var(--border);
  min-height:0;
  transition:margin-left .18s ease;
}
#app.sidebar-collapsed .sidebar{margin-left:-260px;}
.sidebar-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:12px 14px 8px;
  flex-shrink:0;
}
.sidebar-expand-btn{
  display:none;
  position:absolute;
  top:9px;
  left:10px;
  z-index:15;
}
#app.sidebar-collapsed .sidebar-expand-btn{display:inline-flex;}
.new-chat-btn{
  margin:4px 14px 10px;
  text-align:center;
  justify-content:center;
}
.chat-list{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:0 8px 10px;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.chat-list-empty{
  color:var(--text-dim);
  font-size:12px;
  text-align:center;
  padding:18px 10px;
}
.chat-list-item{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 9px;
  border-radius:7px;
  cursor:pointer;
  color:var(--text-dim);
}
.chat-list-item:hover{background:var(--panel-2);}
.chat-list-item.active{background:var(--accent-soft);color:var(--text);}
.chat-list-item .title{
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:12.5px;
}
.chat-list-item.active .title{color:var(--text);font-weight:600;}
.chat-list-item .del{
  flex-shrink:0;
  width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
  border-radius:5px;
  color:var(--text-dim);
  opacity:0;
  font-size:13px;
  line-height:1;
}
.chat-list-item:hover .del{opacity:1;}
.chat-list-item .del:hover{background:var(--border);color:var(--text);}
.chat-list-item .del.confirm{opacity:1;color:#e5534b;}

.btn.danger{border-color:#5a2a26;color:#e5534b;background:transparent;}
.btn.danger:hover{background:rgba(229,83,75,.12);}
.btn.danger.confirm{background:#e5534b;border-color:#e5534b;color:#fff;}

/* ---------- Main panel ---------- */
.main-panel{
  flex:1;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;
  align-items:center;
  gap:16px;
  padding:9px 18px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  flex-wrap:wrap;
  flex-shrink:0;
}
.brand{
  font-weight:600;
  font-size:14.5px;
  letter-spacing:.01em;
  white-space:nowrap;
  color:var(--text);
}

.topbar-spacer{flex:1;}

/* ---------- Buttons ---------- */
.btn{
  appearance:none;
  border:1px solid var(--border);
  background:var(--panel-2);
  color:var(--text);
  font:inherit;
  font-size:12.5px;
  font-weight:500;
  padding:6px 12px;
  border-radius:7px;
  cursor:pointer;
  white-space:nowrap;
}
.btn:hover{background:#161c27;border-color:#293140;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.small{padding:4px 9px;font-size:12px;}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
.btn.ghost:hover{background:var(--panel-2);color:var(--text);}

/* Progress-fill button (model loading / generating), same technique as Emend:
   a fill span behind the label, width driven by JS, so the button itself
   reads as a progress bar without any separate UI element. */
.ai-progress-btn{position:relative;overflow:hidden;}
.ai-progress-btn:disabled{cursor:default;}
.ai-progress-btn.busy:disabled{opacity:1;pointer-events:none;}
.ai-progress-fill{
  position:absolute;
  inset:0 auto 0 0;
  width:0%;
  background:var(--accent-hover);
  transition:width .25s ease;
  z-index:0;
}
.ai-progress-label{position:relative;z-index:1;white-space:nowrap;}

/* ---------- Dropdown menus (theme / model) ---------- */
.menu-wrap{position:relative;}
.dropdown-panel{
  display:none;
  position:absolute;
  top:calc(100% + 6px);
  right:0;
  min-width:260px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  box-shadow:0 12px 32px rgba(0,0,0,.35);
  z-index:20;
}
.dropdown-panel.open{display:block;}
.dropdown-panel .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.dropdown-panel .row:last-child{margin-bottom:0;}
.dropdown-panel .label{font-weight:600;font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
.model-panel{max-height:min(70vh,520px);overflow-y:auto;}


.theme-swatch{
  width:26px;height:26px;border-radius:50%;cursor:pointer;
  border:2px solid var(--border);background:var(--sw-bg);
  box-shadow:inset 0 0 0 8px var(--sw-accent);
}
.theme-swatch.selected{border-color:var(--accent);}

.accent-swatch{
  width:22px;height:22px;border-radius:50%;cursor:pointer;
  border:2px solid var(--border);background:var(--sw-accent);
  flex-shrink:0;
}
.accent-swatch.selected{border-color:var(--text);box-shadow:0 0 0 1px var(--text);}
.accent-picker{
  width:22px;height:22px;border:none;padding:0;background:transparent;cursor:pointer;
  border-radius:50%;flex-shrink:0;overflow:hidden;
}
.accent-picker::-webkit-color-swatch-wrapper{padding:0;}
.accent-picker::-webkit-color-swatch{border:2px solid var(--border);border-radius:50%;}
.accent-picker::-moz-color-swatch{border:2px solid var(--border);border-radius:50%;}
.accent-reset{
  font-size:11px;color:var(--text-dim);cursor:pointer;padding:2px 6px;
  border-radius:5px;border:1px solid var(--border);background:transparent;
}
.accent-reset:hover{background:var(--panel-2);color:var(--text);}

.chip{
  border:1px solid var(--border);
  background:var(--panel-2);
  color:var(--text-dim);
  font-size:12px;
  padding:5px 10px;
  border-radius:20px;
  cursor:pointer;
}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

.model-option{
  display:flex;
  flex-direction:column;
  gap:2px;
  border:1px solid var(--border);
  background:var(--panel-2);
  border-radius:8px;
  padding:8px 10px;
  cursor:pointer;
  width:100%;
}
.model-option.selected{border-color:var(--accent);}
.model-option.unavailable{opacity:.5;cursor:not-allowed;}
.model-option .name{font-weight:600;font-size:12.5px;color:var(--text);}
.model-option .meta{font-size:10.5px;color:var(--text-dim);}

/* ---------- Chat area ---------- */
.chat-wrap{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:0 18px;
}
.chat-scroll{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:20px 4px 12px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.chat-empty{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:var(--text-dim);
  text-align:center;
  padding:24px;
}
.chat-empty .big{font-size:16px;color:var(--text);font-weight:600;}

.msg{
  display:flex;
  gap:10px;
  max-width:78%;
}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg.assistant{align-self:flex-start;}
.msg .avatar{
  flex-shrink:0;
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;
  background:var(--panel-2);
  border:1px solid var(--border);
  color:var(--text-dim);
}
.msg.user .avatar{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.msg .bubble{
  background:var(--assistant-bubble);
  border:1px solid var(--border);
  border-radius:12px;
  padding:9px 13px;
  font-size:13.5px;
  line-height:1.55;
  word-break:break-word;
}
.msg.user .bubble{background:var(--user-bubble);white-space:pre-wrap;}
/* Assistant bubbles hold rendered markdown (block elements handle their own
   line breaks via <p>/<br>), so they don't want pre-wrap's literal
   whitespace preservation the way a plain-text user bubble does. */
.msg.assistant .bubble{white-space:normal;}
.msg .bubble p{margin:0 0 8px;}
.msg .bubble p:last-child{margin-bottom:0;}
.msg .bubble ul,.msg .bubble ol{margin:0 0 8px;padding-left:20px;}
.msg .bubble ul:last-child,.msg .bubble ol:last-child{margin-bottom:0;}
.msg .bubble li{margin:2px 0;}
.msg .bubble h1,.msg .bubble h2,.msg .bubble h3,.msg .bubble h4,.msg .bubble h5,.msg .bubble h6{margin:10px 0 6px;line-height:1.3;}
.msg .bubble h1:first-child,.msg .bubble h2:first-child,.msg .bubble h3:first-child,.msg .bubble h4:first-child,.msg .bubble h5:first-child,.msg .bubble h6:first-child{margin-top:0;}
.msg .bubble code{background:var(--panel-2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:.92em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
.msg .bubble pre{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:0 0 8px;overflow-x:auto;}
.msg .bubble pre:last-child{margin-bottom:0;}
.msg .bubble pre code{background:none;border:none;padding:0;}
.msg .bubble a{color:var(--accent);}
.msg .bubble .thinking{margin:0 0 8px;padding:6px 9px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);}
.msg .bubble .thinking summary{cursor:pointer;font-size:12px;color:var(--text-dim);user-select:none;}
.msg .bubble .thinking[open] summary{margin-bottom:6px;}
.msg .bubble .thinking p{font-size:12.5px;color:var(--text-dim);}
.msg .bubble .thinking-wait{color:var(--text-dim);font-style:italic;margin:0;}
.msg .bubble .cursor{display:inline-block;width:7px;height:1em;background:var(--text-dim);vertical-align:text-bottom;margin-left:1px;animation:blink 1s step-start infinite;}
@keyframes blink{50%{opacity:0;}}
.msg .model-tag{font-size:10px;color:var(--text-dim);margin-top:4px;}
.msg{position:relative;}
.msg .msg-actions{position:absolute;top:0;right:0;display:none;gap:4px;}
.msg:hover .msg-actions{display:flex;}
.msg-actions .btn{padding:2px 6px;font-size:11px;opacity:.7;}
.msg-actions .btn:hover{opacity:1;}
.msg.editing .bubble{outline:2px solid var(--accent);outline-offset:2px;}
.msg textarea.msg-edit{width:100%;min-height:60px;resize:vertical;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--text);font:inherit;font-size:13px;line-height:1.5;margin-top:6px;}
.msg textarea.msg-edit:focus{outline:none;border-color:var(--accent);}

/* ---------- Composer ---------- */
.composer{
  flex-shrink:0;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:12px 4px 16px;
}
.composer textarea{
  flex:1;
  resize:none;
  min-height:22px;
  max-height:200px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 12px;
  color:var(--text);
  font:inherit;
  font-size:13.5px;
  line-height:1.5;
}
.composer textarea:focus{outline:none;border-color:var(--accent);}
.composer .btn{height:38px;}

.statusbar{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding:5px 18px;
  font-size:11px;
  color:var(--text-dim);
  border-top:1px solid var(--border);
  background:var(--panel);
}
.statusbar .statusbar-spacer{flex:1;}

</style>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">Palaver <span style="font-weight:400;font-size:11px;color:var(--text-dim)">v37</span></div>
      <button class="btn ghost small" id="sidebarCollapseBtn" title="Collapse sidebar">‹</button>
    </div>
    <button class="btn primary new-chat-btn" id="newChatBtn">+ New chat</button>
    <div class="chat-list" id="chatList"></div>
  </aside>
  <button class="btn ghost small sidebar-expand-btn" id="sidebarExpandBtn" title="Show chats">›</button>

  <div class="main-panel">
    <header class="topbar">
      <div class="topbar-spacer"></div>

      <div class="menu-wrap model-wrap">
        <button class="btn ghost" id="modelToggleBtn">Model: <span id="modelBtnLabel">…</span></button>
        <div class="dropdown-panel model-panel" id="modelPanel">
          <div class="label">AI model</div>
          <div class="row" id="aiModelList"></div>
        </div>
      </div>

      <div class="menu-wrap settings-wrap">
        <button class="btn ghost" id="settingsToggleBtn">Settings</button>
        <div class="dropdown-panel settings-panel" id="settingsPanel">
          <div class="label">Theme</div>
          <div class="row" id="themeRow"></div>
          <div class="label">Accent color</div>
          <div class="row" id="accentRow" style="align-items:center"></div>
          <div class="label">Chats</div>
          <div class="row">
            <button class="btn small danger" id="deleteAllChatsBtn">Delete all chats</button>
          </div>
          <div class="label">Thinking</div>
          <div class="row">
            <button class="btn small" id="thinkingModeBtn">Thinking mode: Off</button>
          </div>
          <div class="label">System prompt</div>
          <div class="row" style="flex-direction:column;width:100%">
            <textarea id="systemPromptInput" rows="3" style="width:100%;resize:vertical;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--text);font:inherit;font-size:12px;line-height:1.4"></textarea>
            <button class="btn small" id="saveSystemPromptBtn" style="align-self:flex-end;margin-top:4px">Save</button>
          </div>

        </div>
      </div>
    </header>

    <main class="chat-wrap">
      <div class="chat-scroll" id="chatScroll">
        <div class="chat-empty" id="chatEmpty">
          <div class="big">Start a conversation</div>
        </div>
      </div>

      <div class="composer">
        <textarea id="composerInput" rows="1" placeholder="Message Palaver…"></textarea>
        <button class="btn primary ai-progress-btn" id="sendBtn"><span class="ai-progress-fill" id="aiProgressFill"></span><span class="ai-progress-label" id="aiProgressLabel">Send</span></button>
      </div>
    </main>

    <div class="statusbar">
      <span id="engineStatus">Loading…</span>
      <div class="statusbar-spacer"></div>
      <span id="msgCount"></span>
    </div>
  </div>
</div>

<script>
/* Palaver: an offline AI chat. Models run on-device via transformers.js,
   nothing you type ever leaves the browser. Download + generation happen
   inside a dedicated Web Worker so the page stays responsive. */
(() => {
  'use strict';

  const TRANSFORMERS_CDN = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0';
  // JSPI ORT build with Blob-backed external data streaming, keeps peak JS heap
  // near one chunk instead of the full model size.
  const JSPI_ORT_CDN = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/ort.jspi.min.mjs';
  const MATHJS_CDN = 'https://cdn.jsdelivr.net/npm/mathjs@13.2.2/lib/browser/math.js';
  const DAYJS_CDN = 'https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js';
  const DAYJS_RELATIVE_CDN = 'https://cdn.jsdelivr.net/npm/dayjs@1.11.13/plugin/relativeTime.js';
  const DAYJS_ADVANCEDFORMAT_CDN = 'https://cdn.jsdelivr.net/npm/dayjs@1.11.13/plugin/advancedFormat.js';

  // Mirror of model weights pre-split into <20MB chunks in our own GitHub repo,
  // a fallback for anyone who can't reach huggingface.co directly. Models listed
  // here (via cdnFolder) use it; everything else loads from HF as normal.
  const CDN_REPO = 'https://cdn.jsdelivr.net/gh/Sm0keSkreen/palaver-models@main/';

  const MODELS = {
    gemma270m: { id: 'onnx-community/gemma-3-270m-it-ONNX', label: 'Gemma 270M', meta: '~320MB · Google, light',     dtype: 'q4', cdnFolder: 'gemma270m' },
    gemma1b:   { id: 'onnx-community/gemma-3-1b-it-ONNX',   label: 'Gemma 1B',   meta: '~860MB · Google, newer arch',      dtype: 'q4', cdnFolder: 'gemma1b' },
    // Gemma 4's smallest tier. Multimodal under the hood (vision + audio
    // encoders always download even though this app only sends text), ~3.4GB.
    // Needs its own processor/model classes and a different message shape,
    // which is what the `task` field triggers (see loadPipeline/generate
    // in WORKER_SRC).
    gemma4e2b: {
      id: 'onnx-community/gemma-4-E2B-it-ONNX', label: 'Gemma 4 E2B',
      meta: '~3.4GB · Google, newest architecture, large download',
      dtype: 'q4f16', task: 'gemma4', cdnFolder: 'gemma4e2b',
    },
  };
  const DEFAULT_MODEL = 'gemma270m';

  const SYSTEM_PROMPT_KEY = 'palaver-system-prompt';
  let userSystemPrompt = null;
  try { userSystemPrompt = localStorage.getItem(SYSTEM_PROMPT_KEY); } catch {}

  const SYSTEM_PROMPT_DEFAULT = 'You are Palaver, a helpful, friendly AI assistant running locally in the browser. Keep replies clear and concise unless asked for detail.';
  function getSystemPrompt() {
    return userSystemPrompt || SYSTEM_PROMPT_DEFAULT;
  }
  const MAX_NEW_TOKENS = 768;
  const MAX_INPUT_LENGTH = 8000;
  // A loaded model stays resident across messages, no idle-unload timer.
  // Only loading a *different* model discards the previous one (see
  // "Keep at most one model resident" below).

  const THEMES = [
    { id: 'midnight', label: 'Midnight', bg: '#080b11', accent: '#3e82f7' },
    { id: 'nord', label: 'Nord', bg: '#2e3440', accent: '#5e81ac' },
    { id: 'ocean', label: 'Ocean', bg: '#0d1117', accent: '#388bfd' },
    { id: 'sky', label: 'Sky', bg: '#f2f6fc', accent: '#2f7de9' },
  ];

  const $ = (s) => document.querySelector(s);
  const modelToggleBtn = $('#modelToggleBtn');
  const modelBtnLabel = $('#modelBtnLabel');
  const modelPanel = $('#modelPanel');
  const modelList = $('#aiModelList');
  const settingsToggleBtn = $('#settingsToggleBtn');
  const settingsPanel = $('#settingsPanel');
  const themeRow = $('#themeRow');
  const deleteAllChatsBtn = $('#deleteAllChatsBtn');
  const thinkingModeBtn = $('#thinkingModeBtn');
  const sidebar = $('#sidebar');
  const sidebarCollapseBtn = $('#sidebarCollapseBtn');
  const sidebarExpandBtn = $('#sidebarExpandBtn');
  const newChatBtn = $('#newChatBtn');
  const chatList = $('#chatList');
  const chatScroll = $('#chatScroll');
  const chatEmpty = $('#chatEmpty');
  const composerInput = $('#composerInput');
  const sendBtn = $('#sendBtn');
  const aiProgressFill = $('#aiProgressFill');
  const aiProgressLabel = $('#aiProgressLabel');
  const engineStatus = $('#engineStatus');
  const msgCount = $('#msgCount');

  const SKIP_KEY_PREFIX = 'palaver-ai-skip-';
  const SKIP_REASON_KEY_PREFIX = 'palaver-ai-skip-reason-';
  const CHATS_KEY = 'palaver-chats-v1';
  const THINKING_MODE_KEY = 'palaver-thinking-mode';

  const state = {
    modelKey: DEFAULT_MODEL,
    chats: [],              // [{id, title, messages, modelKey, createdAt, updatedAt}], most-recent-first
    chatId: null,
    unavailable: {},       // modelKey -> true once confirmed to fail on this device
    pipelinesReady: {},
    loadPromises: {},
    loading: null,
    loadingPct: null,
    loadStartedAt: null,
    loadError: null,
    loadErrorMessages: {}, // modelKey -> raw error text from the worker, for the last load attempt
    generating: false,
    genTokens: 0,
    genMaxTokens: 0,
    genStartedAt: null,
    messages: [],           // {role:'user'|'assistant', content, modelLabel?}
    stopRequested: false,
    thinkingEnabled: false, // lets model reason before answering; ignored if model doesn't support it
  };

  try {
    Object.keys(MODELS).forEach((k) => {
      if (sessionStorage.getItem(SKIP_KEY_PREFIX + k) === '1') {
        state.unavailable[k] = true;
        // The skip flag alone survives a reload; the reason text needs its
        // own persisted copy too, or a re-opened tab shows the generic
        // "isn't supported" message instead of the real cause.
        const savedReason = sessionStorage.getItem(SKIP_REASON_KEY_PREFIX + k);
        if (savedReason) state.loadErrorMessages[k] = savedReason;
      }
    });
    if (state.unavailable[state.modelKey]) {
      const firstOk = Object.keys(MODELS).find((k) => !state.unavailable[k]);
      if (firstOk) state.modelKey = firstOk;
    }
  } catch { /* storage unavailable; ignore */ }

  try {
    state.thinkingEnabled = localStorage.getItem(THINKING_MODE_KEY) === '1';
  } catch { /* storage unavailable; ignore */ }

  /* ---- Local tools for 1B models ---- */
  // Deterministic JS tools for math, date/time, and text work that the 1B
  // model would otherwise hallucinate on.

  let mathjs = null;
  let dayjs = null;

  async function loadMathJS() {
    if (mathjs) return mathjs;
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = MATHJS_CDN;
      s.onload = resolve;
      s.onerror = () => reject(new Error('Failed to load math.js'));
      document.head.appendChild(s);
    });
    mathjs = math;
    return mathjs;
  }

  async function loadDayJS() {
    if (dayjs) return dayjs;
    const dayjsModule = await import(DAYJS_CDN);
    dayjs = dayjsModule.default || dayjsModule;
    const relativeTime = await import(DAYJS_RELATIVE_CDN);
    const advancedFormat = await import(DAYJS_ADVANCEDFORMAT_CDN);
    dayjs.extend(relativeTime.default || relativeTime);
    dayjs.extend(advancedFormat.default || advancedFormat);
    return dayjs;
  }

  // Evaluate a math expression via math.js. Returns { result, formatted }
  // or { error }. Strips natural-language wrappers ("what is", "calculate")
  // so the 1B model doesn't need to.
  async function evalMath(expr) {
    try {
      const m = await loadMathJS();
      // Strip conversational filler
      let cleaned = expr
        .replace(/^(what\s+is|calculate|compute|evaluate|solve|find)\s+/i, '')
        .replace(/\?+$/, '')
        .trim();
      // Convert word operators
      cleaned = cleaned
        .replace(/\bplus\b/gi, '+')
        .replace(/\bminus\b/gi, '-')
        .replace(/\btimes\b/gi, '*')
        .replace(/\bmultiplied\s+by\b/gi, '*')
        .replace(/\bdivided\s+by\b/gi, '/')
        .replace(/\bover\b/gi, '/')
        .replace(/\bto\s+the\s+power\s+of\b/gi, '^')
        .replace(/\bsquared\b/gi, '^2')
        .replace(/\bcubed\b/gi, '^3')
        .replace(/\bsquare\s+root\s+of\b/gi, 'sqrt(')
        .replace(/\bsqrt\b/gi, 'sqrt');
      // Auto-close unclosed parens
      const open = (cleaned.match(/\(/g) || []).length;
      const close = (cleaned.match(/\)/g) || []).length;
      for (let i = close; i < open; i++) cleaned += ')';
      const result = m.evaluate(cleaned);
      const formatted = typeof result === 'number'
        ? (Number.isInteger(result) ? result.toLocaleString() : result.toPrecision(10).replace(/\.?0+$/, ''))
        : String(result);
      return { result, formatted };
    } catch (err) {
      return { error: err.message };
    }
  }

  // Parse relative or absolute date strings deterministically.
  async function parseDate(expr) {
    try {
      const djs = await loadDayJS();
      // Try relative time first ("next tuesday", "in 3 hours", "2 days ago")
      let dt = djs(expr);
      if (!dt.isValid()) {
        // Try adding "in" prefix for relative expressions
        dt = djs('in ' + expr);
      }
      if (!dt.isValid()) {
        // Try removing common prefixes
        const stripped = expr.replace(/^(what\s+is|when\s+is|when)\s+/i, '').replace(/\?+$/, '').trim();
        dt = djs(stripped);
      }
      if (!dt.isValid()) return { error: 'Could not parse date: ' + expr };
      return {
        result: dt.toISOString(),
        formatted: dt.format('dddd, MMMM D, YYYY [at] h:mm A'),
        relative: dt.fromNow(),
      };
    } catch (err) {
      return { error: err.message };
    }
  }

  // Clean text extraction (DOM readability).
  // Accepts HTML string, returns cleaned plain text.
  function cleanHtmlText(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    // Remove script, style, nav, footer, header elements
    doc.querySelectorAll('script,style,nav,footer,header,aside,iframe,noscript').forEach((el) => el.remove());
    // Remove attributes except href on a tags
    doc.querySelectorAll('*').forEach((el) => {
      if (el.tagName !== 'A') {
        for (const attr of [...el.attributes]) el.removeAttribute(attr.name);
      }
    });
    let text = doc.body?.textContent || '';
    // Collapse whitespace
    text = text.replace(/\s+/g, ' ').trim();
    // Truncate to ~200 words to fit 1B model context
    const words = text.split(' ');
    if (words.length > 200) text = words.slice(0, 200).join(' ') + '…';
    return text;
  }

  // Heuristic pre-routing: detect math/date questions and route to the tool.
  // Returns { handled, raw } if a tool answered it, or { handled: false }.
  function heuristicRoute(text) {
    const lower = text.toLowerCase().replace(/[?!.]+$/g, '').trim();

    // Math detection: contains digits AND math operators, or starts with
    // "what is", "calculate", "compute", "how much is", "how many"
    const mathOps = /[+\-*/^%]|[xX×]|[÷]|[=]{2}|sqrt|log|sin|cos|tan|pi|e\b/i;
    const hasDigits = /\d/.test(text);
    const mathPrefixes = /^(what\s+is|calculate|compute|evaluate|solve|find|how\s+much\s+is|how\s+many)\b/i;

    if ((hasDigits && mathOps.test(text)) || mathPrefixes.test(lower)) {
      // Exclude things like "what is the best" or "how many messages"
      const nonMathEndings = /\b(best|good|bad|worst|fast|slow|popular|common|rare|easy|hard|fun|cool|nice|boring|interesting)\b/i;
      if (!nonMathEndings.test(lower)) {
        return { handled: 'math', raw: text };
      }
    }

    // Date detection: contains date-related keywords
    const dateKeywords = /\b(today|tomorrow|yesterday|next\s+\w+|last\s+\w+|in\s+\d+\s+(hour|minute|day|week|month|year)|ago|date|day\s+of\s+the\s+week|what\s+day|when)\b/i;
    const hasDateContext = dateKeywords.test(text) && /\d/.test(text) || /\b(today|tomorrow|yesterday)\b/i.test(text);
    if (hasDateContext && !mathOps.test(text)) {
      return { handled: 'date', raw: text };
    }

    // Text analysis: "count words", "how many words", "word count"
    if (/\b(count|how\s+many)\s+(words?|chars?|characters?|sentences?|letters?|lines?)\b/i.test(text) ||
        /\b(word|char|character|sentence|letter|line)\s+count\b/i.test(text)) {
      return { handled: 'count', raw: text };
    }

    // Case conversion
    if (/\b(uppercase|UPPERCASE|upper\s*case|to\s+upper)\b/i.test(text)) return { handled: 'case', raw: text, mode: 'upper' };
    if (/\b(lowercase|lower\s*case|to\s+lower)\b/i.test(text)) return { handled: 'case', raw: text, mode: 'lower' };
    if (/\b(title\s*case|title\s*case)\b/i.test(text)) return { handled: 'case', raw: text, mode: 'title' };
    if (/\b(reverse|backwards)\b/i.test(text) && text.length < 200) return { handled: 'case', raw: text, mode: 'reverse' };

    // JSON formatting
    if (/\b(format|pretty|validate|check)\s+json\b/i.test(text) || /\bjson\s+(format|pretty|validate|check)\b/i.test(text)) {
      return { handled: 'json', raw: text };
    }

    // Base64
    if (/\bbase\s*64\s+(encode|decode)\b/i.test(text) || /\b(encode|decode)\s+base\s*64\b/i.test(text)) {
      return { handled: 'base64', raw: text };
    }

    // URL parsing
    if (/\b(parse|extract|break\s+down)\s+(the\s+)?url\b/i.test(text || /\burl\s+(parse|extract)\b/i.test(text))) {
      return { handled: 'url', raw: text };
    }
    if (/^https?:\/\//.test(text.trim()) && text.trim().length < 500 && !text.includes(' ')) {
      return { handled: 'url', raw: text };
    }

    // UUID
    if (/\b(generate|create|make)\s+(a\s+)?(uuid|guid)\b/i.test(text) || /\b(uuid|guid)\s+(generate|create|make)\b/i.test(text)) {
      return { handled: 'uuid', raw: text };
    }

    // Hash
    if (/\b(hash|sha-?256|sha-?512|md5)\s+(this|the\s+text|below)\b/i.test(text) ||
        /\b(hash|sha-?256|sha-?512|md5)\s+(encode|of|for)\b/i.test(text)) {
      return { handled: 'hash', raw: text };
    }

    // Color conversion
    if (/\b(convert|what\s+is|what's)\s+(the\s+)?(color|colour)\b/i.test(text) ||
        /^#?[0-9a-f]{3,6}$/i.test(text.trim())) {
      return { handled: 'color', raw: text };
    }

    // Timestamp
    if (/\b(unix\s+timestamp|epoch|convert\s+(the\s+)?timestamp|what\s+time|what\s+date)\b/i.test(text) ||
        /\b(timestamp|epoch)\s+(to|convert)\b/i.test(text)) {
      return { handled: 'timestamp', raw: text };
    }

    // Base conversion
    if (/\b(convert|what\s+is|what's)\s+\d+\s+(to|in|as)\s+(binary|hex|octal|decimal)\b/i.test(text)) {
      return { handled: 'base', raw: text };
    }

    // CSV to JSON
    if (/\b(csv\s+to\s+json|convert\s+csv|parse\s+csv)\b/i.test(text)) {
      return { handled: 'csv', raw: text };
    }

    // Diff
    if (/\b(diff|compare|difference\s+between)\b/i.test(text) && text.includes('\n')) {
      return { handled: 'diff', raw: text };
    }

    // Password
    if (/\b(generate|create|make)\s+(a\s+)?password\b/i.test(text)) {
      return { handled: 'password', raw: text };
    }

    return { handled: false };
  }

  /* ---- Deterministic text tools (no model needed) ---- */

  function countText(text) {
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    const chars = text.length;
    const charsNoSpace = text.replace(/\s/g, '').length;
    const sentences = text.split(/[.!?]+/).filter((s) => s.trim()).length;
    const paragraphs = text.split(/\n\s*\n/).filter((s) => s.trim()).length;
    const readingMin = Math.max(1, Math.ceil(words / 200));
    return { words, chars, charsNoSpace, sentences, paragraphs, readingMin };
  }

  function convertCase(text, mode) {
    switch (mode) {
      case 'upper': return text.toUpperCase();
      case 'lower': return text.toLowerCase();
      case 'title': return text.replace(/\w\S*/g, (w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
      case 'sentence': return text.replace(/(^\s*|[.!?]\s+)(\w)/g, (_, sep, c) => sep + c.toUpperCase());
      case 'reverse': return text.split('').reverse().join('');
      case 'slug': return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      case 'trim': return text.replace(/^\s+|\s+$/g, '').replace(/\n{3,}/g, '\n\n');
      default: return text;
    }
  }

  function formatJson(text) {
    try {
      const parsed = JSON.parse(text);
      return { formatted: JSON.stringify(parsed, null, 2), valid: true };
    } catch (err) {
      return { error: err.message, valid: false };
    }
  }

  function base64Encode(text) { return btoa(unescape(encodeURIComponent(text))); }
  function base64Decode(text) { return decodeURIComponent(escape(atob(text))); }

  function parseUrl(text) {
    try {
      const u = new URL(text);
      const params = {};
      u.searchParams.forEach((v, k) => { params[k] = v; });
      return { protocol: u.protocol, hostname: u.hostname, port: u.port, pathname: u.pathname, search: u.search, hash: u.hash, params, origin: u.origin };
    } catch { return { error: 'Invalid URL' }; }
  }

  function testRegex(pattern, flags, text) {
    try {
      const re = new RegExp(pattern, flags);
      const matches = [];
      let m;
      if (flags.includes('g')) {
        while ((m = re.exec(text)) !== null) {
          matches.push({ match: m[0], index: m.index, groups: m.slice(1) });
          if (m.index === re.lastIndex) re.lastIndex++;
        }
      } else {
        m = re.exec(text);
        if (m) matches.push({ match: m[0], index: m.index, groups: m.slice(1) });
      }
      return { matches, count: matches.length };
    } catch (err) { return { error: err.message }; }
  }

  function generateUuid() {
    return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, (c) =>
      (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
    );
  }

  async function hashText(text, algo) {
    const enc = new TextEncoder().encode(text);
    const algos = { 'md5': 'SHA-1', 'sha1': 'SHA-1', 'sha256': 'SHA-256', 'sha512': 'SHA-512' };
    const useAlgo = algos[algo] || 'SHA-256';
    const hash = await crypto.subtle.digest(useAlgo, enc);
    return [...new Uint8Array(hash)].map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  function convertColor(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    if (!/^[0-9a-f]{6}$/i.test(hex)) return { error: 'Invalid hex color' };
    const r = parseInt(hex.slice(0, 2), 16);
    const g = parseInt(hex.slice(2, 4), 16);
    const b = parseInt(hex.slice(4, 6), 16);
    const hsl = (() => {
      const rn = r / 255, gn = g / 255, bn = b / 255;
      const max = Math.max(rn, gn, bn), min = Math.min(rn, gn, bn);
      const l = (max + min) / 2;
      let h = 0, s = 0;
      if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        if (max === rn) h = ((gn - bn) / d + (gn < bn ? 6 : 0)) / 6;
        else if (max === gn) h = ((bn - rn) / d + 2) / 6;
        else h = ((rn - gn) / d + 4) / 6;
      }
      return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
    })();
    return { hex: '#' + hex, rgb: `rgb(${r}, ${g}, ${b})`, hsl: `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)` };
  }

  function convertTimestamp(input) {
    const trimmed = input.replace(/^(convert|what\s+is|what's|show)\s+/i, '').replace(/\?+$/g, '').trim();
    let ms = 0;
    if (/^\d{10}$/.test(trimmed)) ms = Number(trimmed) * 1000;
    else if (/^\d{13}$/.test(trimmed)) ms = Number(trimmed);
    else { const d = new Date(trimmed); if (isNaN(d.getTime())) return { error: 'Invalid timestamp' }; ms = d.getTime(); }
    const d = new Date(ms);
    return {
      unix_s: Math.floor(ms / 1000),
      unix_ms: ms,
      iso: d.toISOString(),
      local: d.toLocaleString(),
      utc: d.toUTCString(),
      relative: dayjs ? dayjs(d).fromNow() : null,
    };
  }

  function convertBase(input) {
    const m = input.replace(/^(convert|what\s+is|what's)\s+/i, '').replace(/\?+$/g, '').trim()
      .match(/^(\d+)\s*(?:to|in|as)\s*(bin(?:ary)?|hex(?:adecimal)?|oct(?:al)?|dec(?:imal)?)$/i);
    if (!m) {
      const n = parseInt(input.replace(/[^0-9a-fA-Fx]/g, ''), 0);
      if (isNaN(n)) return { error: 'Could not parse number' };
      return { decimal: n, binary: n.toString(2), octal: n.toString(8), hexadecimal: '0x' + n.toString(16).toUpperCase() };
    }
    const n = parseInt(m[1], 10);
    if (isNaN(n)) return { error: 'Invalid number' };
    return { decimal: n, binary: n.toString(2), octal: n.toString(8), hexadecimal: '0x' + n.toString(16).toUpperCase() };
  }

  function csvToJson(csv) {
    try {
      const lines = csv.trim().split('\n');
      if (lines.length < 2) return { error: 'Need at least a header and one data row' };
      const headers = lines[0].split(',').map((h) => h.trim().replace(/^"|"$/g, ''));
      const rows = lines.slice(1).map((line) => {
        const vals = line.split(',').map((v) => v.trim().replace(/^"|"$/g, ''));
        const obj = {};
        headers.forEach((h, i) => { obj[h] = vals[i] || ''; });
        return obj;
      });
      return { json: JSON.stringify(rows, null, 2), count: rows.length };
    } catch (err) { return { error: err.message }; }
  }

  function diffText(a, b) {
    const aLines = a.split('\n'), bLines = b.split('\n');
    const result = [];
    const max = Math.max(aLines.length, bLines.length);
    for (let i = 0; i < max; i++) {
      const al = aLines[i], bl = bLines[i];
      if (al === undefined) result.push('+ ' + bl);
      else if (bl === undefined) result.push('- ' + al);
      else if (al !== bl) { result.push('- ' + al); result.push('+ ' + bl); }
    }
    return { diff: result.join('\n'), additions: result.filter((l) => l.startsWith('+')).length, removals: result.filter((l) => l.startsWith('-')).length };
  }

  function generatePassword(length = 16, opts = {}) {
    const lower = 'abcdefghijklmnopqrstuvwxyz', upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', nums = '0123456789', syms = '!@#$%^&*';
    let chars = lower + upper + nums;
    if (opts.symbols !== false) chars += syms;
    let pw = '';
    const arr = new Uint32Array(length);
    crypto.getRandomValues(arr);
    for (let i = 0; i < length; i++) pw += chars[arr[i] % chars.length];
    return pw;
  }

  /* --------------------------- Worker plumbing --------------------------- */
  const WORKER_SRC = `
    let transformersMod = null;
    const pipelines = {};
    let devicePromise = null;
    let jsDelivrCache = null;

    const HF_REMOTE_HOST = 'https://huggingface.co/';
    const HF_REMOTE_PATH_TEMPLATE = '{model}/resolve/{revision}/';

    async function pickDevice() {
      if (!('gpu' in self.navigator)) return 'wasm';
      try {
        const adapter = await self.navigator.gpu.requestAdapter();
        return adapter ? 'webgpu' : 'wasm';
      } catch {
        return 'wasm';
      }
    }

    // Model weight URLs always look like ".../onnx/<name>.onnx" or
    // ".../onnx/<name>.onnx_data[_N]", the only files that are ever split
    // into chunks in the CDN mirror. Everything else (tokenizer.json,
    // config.json, etc.) is a normal single small file.
    function looksLikeModelWeightFile(url) {
      return /\\/onnx\\/[^/]+\\.onnx(_data(_\\d+)?)?$/.test(url);
    }

    async function sha256Hex(buf) {
      const digest = await crypto.subtle.digest('SHA-256', buf);
      return [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, '0')).join('');
    }

    // A Cache-API-shaped object (match/put) that transformers.js will use
    // in place of its own browser cache when loading from the CDN mirror.
    // For ordinary small files it's a thin pass-through to a real Cache
    // Storage bucket. For a chunked weight file (recognized by a sibling
    // "<file>.manifest.json"), it lazily fetches each chunk, verifies its
    // SHA-256 against the manifest, and streams the bytes back so
    // transformers.js's own download-progress UI keeps working, then
    // stashes the fully-assembled file in the real cache in the background
    // so the next load of the same model is instant.
    function getJsDelivrCache() {
      if (jsDelivrCache) return jsDelivrCache;
      const realCachePromise = ('caches' in self)
        ? self.caches.open('palaver-jsdelivr-v1').catch(() => null)
        : Promise.resolve(null);
      jsDelivrCache = {
        async match(key) {
          const realCache = await realCachePromise;
          if (realCache) {
            try {
              const hit = await realCache.match(key);
              if (hit) return hit;
            } catch { /* ignore cache read errors */ }
          }
          if (!looksLikeModelWeightFile(key)) return undefined;
          let manifest;
          try {
            const mRes = await fetch(key + '.manifest.json');
            if (!mRes.ok) return undefined; // not a chunked file, fall through to a normal fetch
            manifest = await mRes.json();
          } catch {
            return undefined;
          }
          const baseUrl = key.slice(0, key.lastIndexOf('/') + 1);
          // For files under ~200MB, accumulate chunks so we can stash the
          // assembled blob in Cache API for instant offline reloads. For
          // larger files (Gemma 4 E2B is ~3.4GB), accumulating every chunk
          // into a second buffer while the ONNX runtime is also loading
          // them causes peak memory to blow the tab, so the stream passes
          // through directly without buffering, and we skip the cache write.
          const LARGE_FILE_THRESHOLD = 200 * 1024 * 1024;
          const shouldCollect = manifest.totalSize <= LARGE_FILE_THRESHOLD;
          const collected = shouldCollect ? [] : null;
          let idx = 0;
          const stream = new ReadableStream({
            async pull(controller) {
              if (idx >= manifest.parts.length) {
                controller.close();
                if (shouldCollect) {
                  realCachePromise.then(async (cacheToStore) => {
                    if (!cacheToStore) return;
                    try {
                      const fullBlob = new Blob(collected);
                      await cacheToStore.put(key, new Response(fullBlob, {
                        headers: { 'content-length': String(manifest.totalSize), 'content-type': 'application/octet-stream' },
                      }));
                    } catch { /* ignore cache errors */ }
                  });
                }
                return;
              }
              const part = manifest.parts[idx++];
              try {
                const res = await fetch(baseUrl + part.name);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const buf = new Uint8Array(await res.arrayBuffer());
                const hash = await sha256Hex(buf.buffer);
                if (hash !== part.sha256) throw new Error('checksum mismatch for ' + part.name);
                if (shouldCollect) collected.push(buf);
                controller.enqueue(buf);
              } catch (err) {
                controller.error(new Error('CDN chunk fetch failed (' + part.name + '): ' + err.message));
              }
            },
          });
          return new Response(stream, {
            headers: { 'content-length': String(manifest.totalSize), 'content-type': 'application/octet-stream' },
          });
        },
        async put(key, response) {
          const realCache = await realCachePromise;
          if (!realCache) return;
          try { await realCache.put(key, response); } catch { /* ignore cache errors */ }
        },
      };
      return jsDelivrCache;
    }

    // ---- JSPI ORT session loading (Blob-backed external data) ----

    let jspiOrt = null;

    // Create a disk-backed Blob from a chunked file.  Each 18 MB part is
    // downloaded, verified, and enqueued into a ReadableStream.  The stream
    // is consumed by Response.blob(), which on modern Chrome stores the
    // result on disk, keeping peak JS heap at ~18 MB (one chunk at a time)
    // instead of the full file size.  ORT's JSPI async loader then reads
    // byte ranges from this Blob on demand during session creation.
    async function makeChunkedBlob(manifest, baseUrl, onProgress, fileName) {
      const totalSize = manifest.totalSize;
      let loaded = 0;
      const stream = new ReadableStream({
        async pull(controller) {
          for (const part of manifest.parts) {
            const res = await fetch(baseUrl + part.name);
            if (!res.ok) throw new Error('CDN chunk fetch failed (' + part.name + '): HTTP ' + res.status);
            const buf = new Uint8Array(await res.arrayBuffer());
            loaded += buf.byteLength;
            if (onProgress) onProgress({ status: 'progress', file: fileName, loaded, total: totalSize });
            controller.enqueue(buf);
          }
          controller.close();
        },
      });
      return await new Response(stream, {
        headers: { 'content-length': String(totalSize), 'content-type': 'application/octet-stream' },
      }).blob();
    }

    // JSPI ORT sessions return tensors from a separate WASM instance that
    // fails transformers.js's isONNXTensor() check (instanceof against the
    // bundled asyncify ORT's Tensor class).  This wrapper intercepts .run()
    // and re-creates each output tensor using the standard ORT's Tensor
    // constructor so that replaceTensors() and validateInputs() accept them.
    function wrapJspiSession(session) {
      const origRun = session.run.bind(session);
      session.run = async function(feeds) {
        const output = await origRun(feeds);
        // Access the standard ORT Tensor class via the global symbol that
        // transformers.js registered at import time.
        const stdOrt = globalThis[Symbol.for('onnxruntime')];
        const StdTensor = stdOrt && stdOrt.Tensor;
        if (!StdTensor) return output;
        const wrapped = {};
        for (const [key, val] of Object.entries(output)) {
          if (val && typeof val === 'object' && typeof val.type === 'string' && val.dims) {
            wrapped[key] = new StdTensor(val.type, val.data, val.dims);
            if (val.location) wrapped[key].location = val.location;
          } else {
            wrapped[key] = val;
          }
        }
        return wrapped;
      };
      return session;
    }

    // Create an ORT InferenceSession using the JSPI build, with the ONNX graph
    // as a small ArrayBuffer and external data backed by a disk-backed Blob.
    async function createSessionWithBlobData(graphUrl, dataUrl, dataFileName, sessionName, execProviders, onProgress) {
      onProgress({ status: 'progress', file: sessionName + '.onnx', loaded: 0, total: 0 });

      const graphRes = await fetch(graphUrl);
      if (!graphRes.ok) throw new Error('Failed to fetch ' + graphUrl + ': HTTP ' + graphRes.status);
      const graphBuf = new Uint8Array(await graphRes.arrayBuffer());
      onProgress({ status: 'progress', file: sessionName + '.onnx', loaded: graphBuf.byteLength, total: graphBuf.byteLength });

      let externalData = [];
      if (dataUrl) {
        const manifestRes = await fetch(dataUrl + '.manifest.json');
        if (manifestRes.ok) {
          const manifest = await manifestRes.json();
          const baseUrl = dataUrl.slice(0, dataUrl.lastIndexOf('/') + 1);
          const blob = await makeChunkedBlob(manifest, baseUrl, onProgress, dataFileName);
          externalData = [{ path: dataFileName, data: blob }];
        }
      }

      let session = await jspiOrt.InferenceSession.create(graphBuf, {
        executionProviders: execProviders,
        logSeverityLevel: 3,
        externalData,
      });
      session.config = { dtype: 'q4f16', device: execProviders[0] === 'webgpu' ? 'webgpu' : 'wasm' };
      return wrapJspiSession(session);
    }

    async function loadPipeline(modelId, dtype, device, cdnFolder, task, onProgress) {
      if (!transformersMod) {
        transformersMod = await import(${JSON.stringify(TRANSFORMERS_CDN)});
        transformersMod.env.backends.onnx.wasm.numThreads = 1;
        transformersMod.env.backends.onnx.wasm.wasmMemory = {
          initial: 6144,
          maximum: 65536,
          growth: true,
        };
      }
      let pipelineModelId = modelId;
      if (cdnFolder) {
        transformersMod.env.remoteHost = ${JSON.stringify(CDN_REPO)};
        transformersMod.env.remotePathTemplate = '{model}/';
        transformersMod.env.useCustomCache = true;
        transformersMod.env.customCache = getJsDelivrCache();
        pipelineModelId = cdnFolder;
      } else {
        transformersMod.env.remoteHost = HF_REMOTE_HOST;
        transformersMod.env.remotePathTemplate = HF_REMOTE_PATH_TEMPLATE;
        transformersMod.env.useCustomCache = false;
        transformersMod.env.customCache = null;
      }
    // Gemini 4 uses its own processor+model classes instead of pipeline(),
    // no external data materialization via transformers.js.
    if (task === 'gemma4') {
      const [processor, config] = await Promise.all([
          transformersMod.AutoProcessor.from_pretrained(pipelineModelId),
          transformersMod.AutoConfig.from_pretrained(pipelineModelId),
        ]);

        // JSPI ORT is a separate WASM instance for session creation with
        // Blob-backed external data.  Do NOT set it as the global ORT: its
        // WASM build is missing kernels (e.g. GatherBlockQuantized) that the
        // standard asyncify build has.  Instead, wrap each session's .run()
        // to convert output tensors into objects transformers.js recognizes.
        if (!jspiOrt) {
          jspiOrt = await import(${JSON.stringify(JSPI_ORT_CDN)});
          jspiOrt.env.wasm.numThreads = 1;
          jspiOrt.env.wasm.wasmMemory = { initial: 6144, maximum: 65536, growth: true };
        }

        // Determine execution providers
        const execProviders = device === 'webgpu' ? ['webgpu', 'wasm'] : ['wasm'];

        // Session name → { graphFile, dataFile } mapping
        const suffix = '_q4f16';
        const sessionDefs = {
          embed_tokens:         { graphFile: 'embed_tokens' + suffix + '.onnx',         dataFile: 'embed_tokens' + suffix + '.onnx_data' },
          decoder_model_merged: { graphFile: 'decoder_model_merged' + suffix + '.onnx', dataFile: 'decoder_model_merged' + suffix + '.onnx_data' },
          vision_encoder:       { graphFile: 'vision_encoder' + suffix + '.onnx',       dataFile: 'vision_encoder' + suffix + '.onnx_data' },
          audio_encoder:        { graphFile: 'audio_encoder' + suffix + '.onnx',        dataFile: 'audio_encoder' + suffix + '.onnx_data' },
        };

        const sessions = {};
        for (const [name, def] of Object.entries(sessionDefs)) {
          const graphUrl = ${JSON.stringify(CDN_REPO)} + pipelineModelId + '/onnx/' + def.graphFile;
          const dataUrl  = ${JSON.stringify(CDN_REPO)} + pipelineModelId + '/onnx/' + def.dataFile;
          sessions[name] = await createSessionWithBlobData(graphUrl, dataUrl, def.dataFile, name, execProviders, onProgress);
        }

        // Build model from config + our sessions (skips transformers.js
        // session loading which would materialize all external data as Uint8Array)
        const model = new transformersMod.Gemma4ForConditionalGeneration(config, sessions, { generation_config: {} });
        return { isGemma4: true, processor, model };
      }
      return transformersMod.pipeline('text-generation', pipelineModelId, {
        dtype, device, progress_callback: onProgress,
      });
    }

    self.onmessage = async (e) => {
      const msg = e.data;
      if (msg.type === 'loadModel') {
        const { key, modelId, dtype, cdnFolder, task } = msg;
        try {
          if (!devicePromise) devicePromise = pickDevice();
          let device = await devicePromise;
          const files = {};
          const onProgress = (p) => {
            if (p.status === 'progress' && p.file) {
              files[p.file] = p;
              let loaded = 0, total = 0;
              for (const f of Object.values(files)) { loaded += f.loaded || 0; total += f.total || 0; }
              self.postMessage({ type: 'loadProgress', key, pct: total ? Math.round((loaded / total) * 100) : 0 });
            }
          };
          let generator;
          try {
            generator = await loadPipeline(modelId, dtype, device, cdnFolder, task, onProgress);
          } catch (err) {
            if (device !== 'wasm') {
              device = 'wasm';
              generator = await loadPipeline(modelId, dtype, 'wasm', cdnFolder, task, onProgress);
            } else {
              throw err;
            }
          }
          pipelines[key] = generator;
          self.postMessage({ type: 'loadDone', key });
        } catch (err) {
          self.postMessage({ type: 'loadError', key, message: String((err && err.message) || err) });
        }
      } else if (msg.type === 'generate') {
        const { reqId, key, messages, genOpts } = msg;
        try {
          const pipe = pipelines[key];
          if (!pipe) throw new Error('model not loaded: ' + key);
          if (pipe.isGemma4) {
            // Gemma 4 model card shows content as an array of typed parts
            // ({ type: 'text', text: ... }), but that throws inside the chat
            // template ("Unknown ArrayValue filter: trim").  Plain string
            // content (the same shape every other model uses) works, so
            // messages pass through unchanged.
            const { processor, model } = pipe;
            // Gemma 4 thinking: prepend "<|think|>" token in system prompt
            // AND pass enable_thinking to the template; both are required.
            const thinking = !!genOpts.thinking;
            const chatMessages = thinking
              ? messages.map((m, idx) => (idx === 0 && m.role === 'system')
                ? { role: m.role, content: '<|think|>\\n' + m.content }
                : m)
              : messages;
            const prompt = processor.apply_chat_template(chatMessages, {
              add_generation_prompt: true,
              enable_thinking: thinking,
            });
            const inputs = await processor(prompt, null, null, { add_special_tokens: false });
            const streamer = new transformersMod.TextStreamer(processor.tokenizer, {
              skip_prompt: true,
              skip_special_tokens: true,
              callback_function: (chunk) => {
                self.postMessage({ type: 'genChunk', reqId, text: chunk });
              },
            });
            // Google's documented sampling defaults for Gemma 4, not this
            // app's usual temperature/top_p.  do_sample comes from genOpts
            // so Stop behaves the same as other models.  Bigger floor on
            // max_new_tokens when thinking is on so the reasoning trace
            // doesn't eat the entire budget.
            const outputs = await model.generate({
              ...inputs,
              max_new_tokens: thinking ? Math.max(genOpts.max_new_tokens, 1536) : genOpts.max_new_tokens,
              do_sample: genOpts.do_sample,
              temperature: 1.0,
              top_p: 0.95,
              top_k: 64,
              streamer,
            });
            const decoded = processor.batch_decode(
              outputs.slice(null, [inputs.input_ids.dims.at(-1), null]),
              { skip_special_tokens: true },
            );
            self.postMessage({ type: 'genDone', reqId, text: decoded[0] });
            return;
          }
          const streamer = new transformersMod.TextStreamer(pipe.tokenizer, {
            skip_prompt: true,
            skip_special_tokens: true,
            callback_function: (chunk) => {
              self.postMessage({ type: 'genChunk', reqId, text: chunk });
            },
          });
          const thinking = !!genOpts.thinking;
          const wireMessages = thinking
            ? messages.map((m, idx) => (idx === 0 && m.role === 'system')
              ? { role: m.role, content: '<|think|>\\n' + m.content }
              : m)
            : messages;
          const result = await pipe(wireMessages, Object.assign({}, genOpts, { streamer }));
          let text = result && result[0] && result[0].generated_text;
          if (Array.isArray(text)) text = (text[text.length - 1] && text[text.length - 1].content) || '';
          self.postMessage({ type: 'genDone', reqId, text });
        } catch (err) {
          self.postMessage({ type: 'genError', reqId, message: String((err && err.message) || err) });
        }
      }
    };
  `;

  let worker = null;
  let workerReqSeq = 0;
  const pendingGen = new Map(); // reqId -> { resolve, reject, onChunk }

  function makeWorker() {
    const blob = new Blob([WORKER_SRC], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    const w = new Worker(url, { type: 'module' });
    URL.revokeObjectURL(url);
    w.onmessage = onWorkerMessage;
    w.onerror = (err) => {
      console.error('AI worker error:', err);
      const message = (err && (err.message || String(err))) || 'Unknown worker error';
      // Errors that crash the worker script itself never make it through
      // the normal postMessage load/generate error paths. Attribute to the
      // model that was actively loading, if any.
      if (state.loading) state.loadErrorMessages[state.loading] = message;
    };
    return w;
  }
  worker = makeWorker();

  function onWorkerMessage(e) {
    const msg = e.data;
    if (msg.type === 'loadProgress') {
      if (state.loading === msg.key) { state.loadingPct = msg.pct; updateSendBtn(); }
    } else if (msg.type === 'loadDone') {
      state.pipelinesReady[msg.key] = true;
      settleLoad(msg.key, null);
    } else if (msg.type === 'loadError') {
      settleLoad(msg.key, msg.message);
    } else if (msg.type === 'genChunk') {
      const p = pendingGen.get(msg.reqId);
      if (p) p.onChunk(msg.text);
    } else if (msg.type === 'genDone') {
      const p = pendingGen.get(msg.reqId);
      if (p) { pendingGen.delete(msg.reqId); p.resolve(msg.text); }
    } else if (msg.type === 'genError') {
      const p = pendingGen.get(msg.reqId);
      if (p) { pendingGen.delete(msg.reqId); p.reject(new Error(msg.message)); }
    }
  }

  const loadResolvers = {};
  function settleLoad(key, errMessage) {
    const resolver = loadResolvers[key];
    delete loadResolvers[key];
    if (errMessage) {
      state.loadErrorMessages[key] = errMessage;
      // A failed WASM allocation leaves onnxruntime-web's memory maxed out
      // (WebAssembly.Memory can grow but never shrink), so anything else in
      // the same worker would fail identically.  Terminate and start fresh.
      console.warn(`Model "${key}" failed to load; marking unavailable:`, errMessage);
      state.unavailable[key] = true;
      try {
        sessionStorage.setItem(SKIP_KEY_PREFIX + key, '1');
        sessionStorage.setItem(SKIP_REASON_KEY_PREFIX + key, errMessage);
      } catch { /* ignore */ }
      worker.terminate();
      worker = makeWorker();
      state.pipelinesReady = {};
      renderModelOptions();
      if (state.modelKey === key) {
        const fallback = Object.keys(MODELS).find((k) => !state.unavailable[k]);
        if (fallback) {
          state.modelKey = fallback;
          renderModelOptions();
          ensureModel(fallback).then(
            () => { if (resolver) resolver.resolve(); },
            (err) => { if (resolver) resolver.reject(err); },
          );
          return;
        }
      }
      state.loadError = key;
      updateSendBtn();
      if (resolver) resolver.reject(new Error(errMessage));
      return;
    }
    if (resolver) resolver.resolve();
  }

  function ensureModel(key) {
    if (state.pipelinesReady[key]) return Promise.resolve();
    if (state.loadPromises[key]) return state.loadPromises[key];

    // Keep at most one model resident at a time.  Loading a second model on
    // top of an already-loaded one pushes total WASM/GPU memory over the
    // device's ceiling.  Free whatever's loaded before pulling in a new model.
    const otherResident = Object.keys(state.pipelinesReady).find((k) => state.pipelinesReady[k] && k !== key);
    if (otherResident) {
      Object.keys(loadResolvers).forEach((k) => {
        const r = loadResolvers[k];
        delete loadResolvers[k];
        if (r) r.reject(new Error('cancelled: switching models'));
      });
      worker.terminate();
      worker = makeWorker();
      state.pipelinesReady = {};
    }

    const m = MODELS[key];
    state.loading = key;
    state.loadingPct = null;
    state.loadStartedAt = Date.now();
    state.loadError = null;
    updateSendBtn();
    const promise = new Promise((resolve, reject) => { loadResolvers[key] = { resolve, reject }; });
    worker.postMessage({ type: 'loadModel', key, modelId: m.id, dtype: m.dtype, cdnFolder: m.cdnFolder || null, task: m.task || 'text-generation' });
    const tracked = promise.finally(() => {
      if (state.loading === key) state.loading = null;
      delete state.loadPromises[key];
      updateSendBtn();
    });
    state.loadPromises[key] = tracked;
    return tracked;
  }

  // Defense in depth against the strict-alternation requirement: a chat that
  // was saved to localStorage with two consecutive same-role turns would keep
  // failing forever.  Run this on every send to merge same-role turns and
  // self-heal an already-broken chat.
  function alternateMessages(msgs) {
    const out = [];
    for (const m of msgs) {
      const last = out[out.length - 1];
      if (last && last.role === m.role) {
        last.content = last.content ? last.content + '\n\n' + m.content : m.content;
      } else {
        out.push({ role: m.role, content: m.content });
      }
    }
    return out;
  }

  // Characters, not tokens, an exact count needs a real tokenizer call (done
  // inside the worker).  ~4 chars/token heuristic, same as estimateOutputTokens.
  // Without a cap, more history means a bigger KV cache and slower generation
  // on every turn, a real cost on memory-constrained devices.  ~12000 chars
  // (~3000 tokens) is enough for a handful of turns while keeping that cost
  // small; tune if the trade-off shifts.
  const MAX_CONTEXT_CHARS = 12000;

  // Trim what gets sent to the model each turn, oldest first, always keeping
  // at least the most recent message so a long single message still gets sent.
  function buildContextMessages(messages) {
    let used = 0;
    const kept = [];
    for (let i = messages.length - 1; i >= 0; i--) {
      const m = messages[i];
      const len = (m.content || '').length;
      if (kept.length && used + len > MAX_CONTEXT_CHARS) break;
      kept.unshift(m);
      used += len;
    }
    return kept;
  }

  function runGenerate(key, messages, genOpts, onChunk) {
    return new Promise((resolve, reject) => {
      const reqId = ++workerReqSeq;
      pendingGen.set(reqId, { resolve, reject, onChunk });
      worker.postMessage({ type: 'generate', reqId, key, messages, genOpts });
    });
  }

  /* -------------------------------- UI ------------------------------------ */

  function renderModelOptions() {
    modelList.innerHTML = '';
    Object.entries(MODELS).forEach(([key, m]) => {
      const unavailable = !!state.unavailable[key];
      const div = document.createElement('div');
      div.className = 'model-option'
        + (state.modelKey === key ? ' selected' : '')
        + (unavailable ? ' unavailable' : '');
      div.innerHTML = `<span class="name">${m.label}</span><span class="meta">${unavailable ? 'Unavailable on this device' : m.meta}</span>`;
      // Set via property (not baked into innerHTML) so an error message
      // containing quotes or HTML-special characters can't break the markup.
      if (unavailable && state.loadErrorMessages[key]) div.title = state.loadErrorMessages[key];
      div.addEventListener('click', () => selectModel(key));
      modelList.appendChild(div);
    });
    modelBtnLabel.textContent = MODELS[state.modelKey].label;
  }

  function selectModel(key) {
    if (state.unavailable[key]) {
      const reason = state.loadErrorMessages[key];
      flashSendBtn(reason ? `Not supported on this device: ${reason}` : "That model isn't supported on this device.", 3200);
      return;
    }
    state.modelKey = key;
    renderModelOptions();
    updateSendBtn();
    if (!state.pipelinesReady[key] && state.loading !== key) ensureModel(key).catch(() => {});
  }

  function renderThemes() {
    themeRow.innerHTML = '';
    const current = document.documentElement.dataset.theme || 'midnight';
    THEMES.forEach((t) => {
      const btn = document.createElement('button');
      btn.className = 'theme-swatch' + (t.id === current ? ' selected' : '');
      btn.title = t.label;
      btn.style.setProperty('--sw-bg', t.bg);
      btn.style.setProperty('--sw-accent', t.accent);
      btn.addEventListener('click', () => {
        document.documentElement.dataset.theme = t.id;
        renderThemes();
      });
      themeRow.appendChild(btn);
    });
  }

  const ACCENT_KEY = 'palaver-accent-color';
  const ACCENT_PRESETS = [
    { label: 'Blue',   color: '#3e82f7' },
    { label: 'Purple', color: '#8b5cf6' },
    { label: 'Teal',   color: '#14b8a6' },
    { label: 'Green',  color: '#22c55e' },
    { label: 'Orange', color: '#f97316' },
    { label: 'Pink',   color: '#ec4899' },
    { label: 'Gold',   color: '#eab308' },
  ];

  let customAccent = null;
  try { customAccent = localStorage.getItem(ACCENT_KEY) || null; } catch {}

  function paletteFromHex(hex) {
    let r = parseInt(hex.slice(1, 3), 16) / 255;
    let g = parseInt(hex.slice(3, 5), 16) / 255;
    let b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;
    if (max === min) { h = s = 0; }
    else {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
        case g: h = ((b - r) / d + 2) / 6; break;
        case b: h = ((r - g) / d + 4) / 6; break;
      }
    }
    const hDeg = Math.round(h * 360);
    const sPct = Math.round(s * 100);
    const softA = `hsla(${hDeg}, ${sPct}%, ${Math.round(l * 100)}%, 0.12)`;
    const accentHoverL = Math.max(0, l - 0.12);
    return {
      accent: hex,
      accentHover: `hsl(${hDeg}, ${sPct}%, ${Math.round(accentHoverL * 100)}%)`,
      accentSoft: softA,
      bg: `hsl(${hDeg}, ${Math.round(s * 8)}%, 8%)`,
      panel: `hsl(${hDeg}, ${Math.round(s * 10)}%, 12%)`,
      panel2: `hsl(${hDeg}, ${Math.round(s * 10)}%, 16%)`,
      border: `hsl(${hDeg}, ${Math.round(s * 15)}%, 22%)`,
    };
  }

  function applyAccentColor(hex) {
    const root = document.documentElement;
    if (!hex) {
      root.style.removeProperty('--accent');
      root.style.removeProperty('--accent-hover');
      root.style.removeProperty('--accent-soft');
      root.style.removeProperty('--bg');
      root.style.removeProperty('--panel');
      root.style.removeProperty('--panel-2');
      root.style.removeProperty('--border');
    } else {
      const p = paletteFromHex(hex);
      root.style.setProperty('--accent', p.accent);
      root.style.setProperty('--accent-hover', p.accentHover);
      root.style.setProperty('--accent-soft', p.accentSoft);
      root.style.setProperty('--bg', p.bg);
      root.style.setProperty('--panel', p.panel);
      root.style.setProperty('--panel-2', p.panel2);
      root.style.setProperty('--border', p.border);
    }
  }

  function renderAccentRow() {
    const accentRow = $('#accentRow');
    accentRow.innerHTML = '';
    const activeColor = customAccent || '';
    ACCENT_PRESETS.forEach((p) => {
      const btn = document.createElement('button');
      btn.className = 'accent-swatch' + (activeColor === p.color ? ' selected' : '');
      btn.title = p.label;
      btn.style.setProperty('--sw-accent', p.color);
      btn.addEventListener('click', () => {
        customAccent = p.color;
        try { localStorage.setItem(ACCENT_KEY, p.color); } catch {}
        applyAccentColor(p.color);
        renderAccentRow();
      });
      accentRow.appendChild(btn);
    });

    const picker = document.createElement('input');
    picker.type = 'color';
    picker.className = 'accent-picker';
    picker.title = 'Custom color';
    picker.value = activeColor || '#3e82f7';
    picker.addEventListener('input', (e) => {
      customAccent = e.target.value;
      try { localStorage.setItem(ACCENT_KEY, customAccent); } catch {}
      applyAccentColor(customAccent);
      renderAccentRow();
    });
    accentRow.appendChild(picker);

    if (activeColor) {
      const reset = document.createElement('button');
      reset.className = 'accent-reset';
      reset.textContent = 'Reset';
      reset.title = 'Revert to theme default';
      reset.addEventListener('click', () => {
        customAccent = null;
        try { localStorage.removeItem(ACCENT_KEY); } catch {}
        applyAccentColor(null);
        renderAccentRow();
      });
      accentRow.appendChild(reset);
    }
  }

  modelToggleBtn.addEventListener('click', () => {
    modelPanel.classList.toggle('open');
    settingsPanel.classList.remove('open');
  });
  settingsToggleBtn.addEventListener('click', () => {
    settingsPanel.classList.toggle('open');
    modelPanel.classList.remove('open');
  });
  document.addEventListener('click', (e) => {
    const path = e.composedPath();
    if (!path.includes(modelToggleBtn) && !path.includes(modelPanel)) modelPanel.classList.remove('open');
    if (!path.includes(settingsToggleBtn) && !path.includes(settingsPanel)) settingsPanel.classList.remove('open');
  });

  function flashSendBtn(message, ms = 2200) {
    setProgressFill(0);
    aiProgressLabel.textContent = message;
    setTimeout(updateSendBtn, ms);
  }

  function setProgressFill(pct) {
    sendBtn.classList.toggle('busy', pct != null && pct > 0);
    aiProgressFill.style.width = (pct == null ? 0 : Math.max(0, Math.min(100, pct))) + '%';
  }

  function estimateOutputTokens(messages, maxTokens) {
    const totalChars = messages.reduce((n, m) => n + (m.content ? m.content.length : 0), 0);
    const approxInputTokens = Math.max(8, Math.ceil(totalChars / 4));
    const est = Math.ceil(Math.min(approxInputTokens * 0.8, 300));
    return Math.max(24, Math.min(maxTokens, est));
  }

  function estimateEtaSeconds(startedAt, pct) {
    if (!startedAt || pct == null || pct <= 0) return null;
    const elapsedSec = (Date.now() - startedAt) / 1000;
    const ratePerSec = pct / elapsedSec;
    if (!(ratePerSec > 0)) return null;
    return (100 - pct) / ratePerSec;
  }

  function formatEta(seconds) {
    if (seconds == null || !isFinite(seconds) || seconds < 0) return '';
    if (seconds < 1) return 'almost done';
    if (seconds < 60) return `~${Math.round(seconds)}s left`;
    const mins = Math.floor(seconds / 60);
    const secs = Math.round(seconds % 60);
    return `~${mins}m ${secs}s left`;
  }

  function updateSendBtn() {
    if (state.loading === state.modelKey) {
      sendBtn.disabled = true;
      const pct = state.loadingPct;
      setProgressFill(pct != null ? pct : 0);
      const eta = formatEta(estimateEtaSeconds(state.loadStartedAt, pct));
      aiProgressLabel.textContent = pct != null
        ? `Loading ${pct}%${eta ? ' · ' + eta : ''}`
        : 'Loading model…';
      engineStatus.textContent = `Downloading ${MODELS[state.modelKey].label}…`;
    } else if (state.generating) {
      sendBtn.disabled = false;
      const pct = state.genMaxTokens
        ? Math.min(99, Math.round((state.genTokens / state.genMaxTokens) * 100))
        : null;
      setProgressFill(pct != null ? pct : 0);
      aiProgressLabel.textContent = 'Stop';
      engineStatus.textContent = 'Generating…';
    } else if (state.loadError === state.modelKey && !state.pipelinesReady[state.modelKey]) {
      sendBtn.disabled = false;
      setProgressFill(0);
      aiProgressLabel.textContent = 'Retry';
      const reason = state.loadErrorMessages[state.modelKey];
      engineStatus.textContent = reason ? `Model failed to load: ${reason}` : 'Model failed to load';
    } else {
      sendBtn.disabled = false;
      setProgressFill(0);
      aiProgressLabel.textContent = 'Send';
      engineStatus.textContent = state.pipelinesReady[state.modelKey]
        ? `Ready, ${MODELS[state.modelKey].label}`
        : 'Ready';
    }
  }

  /* ------------------------------ Chat log --------------------------------- */

  function scrollToBottom() {
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  function renderMsgCount() {
    const n = state.messages.length;
    msgCount.textContent = n ? `${n} message${n === 1 ? '' : 's'}` : '';
  }

  // Minimal markdown renderer: **bold**, `code`, lists, links, headers.
  // No external library; Palaver is otherwise self-contained apart from
  // transformers.js.  HTML is escaped first, so only tags this code
  // constructs can reach innerHTML.
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderInline(s) {
    const codeSpans = [];
    let out = escapeHtml(s);
    // Inline code first, protected behind placeholders unlikely to collide
    // with real text, so its contents can't be re-interpreted by the
    // bold/italic/link rules below.
    out = out.replace(/`([^`]+)`/g, (_, code) => {
      codeSpans.push(code);
      return '@@PALAVER_CODE_' + (codeSpans.length - 1) + '@@';
    });
  // Scheme-restricted so a model can't produce a javascript: URL that runs
  // on click.
    out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)"']+|mailto:[^\s)"']+)\)/g,
      (_, text, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>`);
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    out = out.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    out = out.replace(/(^|[^\w])_([^_]+)_(?!\w)/g, '$1<em>$2</em>');
    out = out.replace(/@@PALAVER_CODE_(\d+)@@/g, (_, idx) => `<code>${codeSpans[idx]}</code>`);
    return out;
  }
  function renderMarkdown(src) {
    const lines = (src || '').replace(/\r\n/g, '\n').split('\n');
    const html = [];
    let paragraph = [];
    let listType = null; // 'ul' | 'ol' | null
    let listItems = [];
    const flushParagraph = () => {
      if (paragraph.length) {
        html.push('<p>' + paragraph.map(renderInline).join('<br>') + '</p>');
        paragraph = [];
      }
    };
    const flushList = () => {
      if (listType) {
        html.push(`<${listType}>` + listItems.map((it) => '<li>' + renderInline(it) + '</li>').join('') + `</${listType}>`);
        listType = null;
        listItems = [];
      }
    };
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      const fence = line.match(/^```(.*)$/);
      if (fence) {
        flushParagraph(); flushList();
        const codeLines = [];
        i++;
        while (i < lines.length && !/^```\s*$/.test(lines[i])) { codeLines.push(lines[i]); i++; }
        i++; // skip closing fence (or run off the end if unclosed, still renders what streamed in)
        html.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');
        continue;
      }
      const header = line.match(/^(#{1,6})\s+(.*)$/);
      if (header) {
        flushParagraph(); flushList();
        const level = header[1].length;
        html.push(`<h${level}>` + renderInline(header[2]) + `</h${level}>`);
        i++;
        continue;
      }
      const ul = line.match(/^[-*]\s+(.*)$/);
      if (ul) {
        flushParagraph();
        if (listType && listType !== 'ul') flushList();
        listType = 'ul';
        listItems.push(ul[1]);
        i++;
        continue;
      }
      const ol = line.match(/^\d+\.\s+(.*)$/);
      if (ol) {
        flushParagraph();
        if (listType && listType !== 'ol') flushList();
        listType = 'ol';
        listItems.push(ol[1]);
        i++;
        continue;
      }
      if (/^\s*$/.test(line)) {
        flushParagraph(); flushList();
        i++;
        continue;
      }
      flushList();
      paragraph.push(line);
      i++;
    }
    flushParagraph();
    flushList();
    return html.join('\n');
  }

  // With Thinking mode on, Gemma 4 wraps reasoning as
  // "<|channel>thought\n...<channel|>" before the actual answer.
  // No other model produces this marker, so splitThinking() is a no-op for
  // every reply that isn't Gemma 4 with thinking on.
  function splitThinking(raw) {
    const openTag = '<|channel>thought';
    const closeTag = '<channel|>';
    const openIdx = raw.indexOf(openTag);
    if (openIdx === -1) return { thought: '', answer: raw, stillThinking: false };
    let afterOpen = raw.slice(openIdx + openTag.length);
    if (afterOpen.startsWith('\n')) afterOpen = afterOpen.slice(1);
    const closeIdx = afterOpen.indexOf(closeTag);
    if (closeIdx === -1) return { thought: afterOpen, answer: '', stillThinking: true };
    return { thought: afterOpen.slice(0, closeIdx), answer: afterOpen.slice(closeIdx + closeTag.length), stillThinking: false };
  }

  function setBubbleContent(bubble, role, text) {
    if (role !== 'assistant') {
      bubble.textContent = text;
      return;
    }
    const { thought, answer, stillThinking } = splitThinking(text);
    let html = '';
    if (thought) {
      html += '<details class="thinking"' + (stillThinking ? ' open' : '') + '><summary>'
        + (stillThinking ? 'Thinking…' : 'Thinking') + '</summary>' + renderMarkdown(thought) + '</details>';
    }
    html += (stillThinking && !answer) ? '<p class="thinking-wait">Thinking…</p>' : renderMarkdown(answer);
    bubble.innerHTML = html;
  }

  function addMessageBubble(role, initialText, modelLabel) {
    chatEmpty.style.display = 'none';
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? 'U' : 'P';
    const col = document.createElement('div');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    setBubbleContent(bubble, role, initialText || '');
    col.appendChild(bubble);
    if (role === 'assistant') {
      const tag = document.createElement('div');
      tag.className = 'model-tag';
      tag.textContent = modelLabel || '';
      col.appendChild(tag);
      wrap._tag = tag;
    }
    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    if (role === 'user') {
      const editBtn = document.createElement('button');
      editBtn.className = 'btn ghost small';
      editBtn.textContent = 'Edit';
      editBtn.addEventListener('click', () => startEditMessage(wrap));
      actions.appendChild(editBtn);
    }
    if (role === 'assistant') {
      const editBtn = document.createElement('button');
      editBtn.className = 'btn ghost small';
      editBtn.textContent = 'Edit';
      editBtn.addEventListener('click', () => startEditMessage(wrap));
      actions.appendChild(editBtn);
      const regenBtn = document.createElement('button');
      regenBtn.className = 'btn ghost small';
      regenBtn.textContent = 'Regen';
      regenBtn.addEventListener('click', () => regenerateMessage(wrap));
      actions.appendChild(regenBtn);
    }
    wrap.appendChild(actions);
    wrap.appendChild(avatar);
    wrap.appendChild(col);
    chatScroll.appendChild(wrap);
    wrap._bubble = bubble;
    scrollToBottom();
    return wrap;
  }

  function findMsgIndex(wrap) {
