    const bubbles = chatScroll.querySelectorAll('.msg');
    for (let i = 0; i < bubbles.length; i++) {
      if (bubbles[i] === wrap) return i;
    }
    return -1;
  }

  function startEditMessage(wrap) {
    if (state.generating) return;
    const idx = findMsgIndex(wrap);
    if (idx === -1 || idx >= state.messages.length) return;
    const msg = state.messages[idx];
    wrap.classList.add('editing');
    const textarea = document.createElement('textarea');
    textarea.className = 'msg-edit';
    textarea.value = msg.content;
    wrap._bubble.style.display = 'none';
    wrap._bubble.parentNode.insertBefore(textarea, wrap._bubble.nextSibling);
    textarea.focus();
    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn small primary';
    saveBtn.textContent = 'Save';
    saveBtn.style.marginTop = '6px';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn small';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.style.marginTop = '6px';
    const btnRow = document.createElement('div');
    btnRow.style.display = 'flex';
    btnRow.style.gap = '6px';
    btnRow.appendChild(saveBtn);
    btnRow.appendChild(cancelBtn);
    textarea.parentNode.insertBefore(btnRow, textarea.nextSibling);
    function cleanup() {
      textarea.remove();
      btnRow.remove();
      wrap._bubble.style.display = '';
      wrap.classList.remove('editing');
    }
    cancelBtn.addEventListener('click', cleanup);
    saveBtn.addEventListener('click', () => {
      const newContent = textarea.value.trim();
      if (!newContent) return;
      msg.content = newContent;
      setBubbleContent(wrap._bubble, msg.role, newContent);
      cleanup();
      persistCurrentChat();
      // If editing a user message, remove all messages after it and re-send
      if (msg.role === 'user') {
        state.messages.splice(idx + 1);
        const bubbles = chatScroll.querySelectorAll('.msg');
        for (let i = idx + 1; i < bubbles.length; i++) bubbles[i].remove();
        renderMsgCount();
        // Re-trigger generation for the edited user message
        composerInput.value = '';
        doSendWithHistory(idx);
      }
    });
  }

  async function doSendWithHistory(upToIdx) {
    if (state.generating) return;
    state.generating = true;
    state.stopRequested = false;
    state.genTokens = 0;
    state.genStartedAt = Date.now();
    updateSendBtn();
    const modelKeyAtStart = state.modelKey;
    const wireMessages = alternateMessages([
      { role: 'system', content: getSystemPrompt() },
      ...buildContextMessages(state.messages.slice(0, upToIdx + 1)).map((m) => ({
        role: m.role,
        content: m.role === 'assistant' ? (splitThinking(m.content).answer || m.content) : m.content,
      })),
    ]);
    const genOpts = { max_new_tokens: MAX_NEW_TOKENS, temperature: 0.7, top_p: 0.9, do_sample: true, thinking: state.thinkingEnabled };
    state.genMaxTokens = estimateOutputTokens(wireMessages, MAX_NEW_TOKENS);
    const wrap = addMessageBubble('assistant', '', MODELS[modelKeyAtStart].label);
    currentGenWrap = wrap;
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    wrap._bubble.appendChild(cursor);
    let acc = '';
    try {
      await runGenerate(modelKeyAtStart, wireMessages, genOpts, (chunk) => {
        acc += chunk;
        state.genTokens += 1;
        wrap._rawText = acc;
        setBubbleContent(wrap._bubble, 'assistant', acc);
        wrap._bubble.appendChild(cursor);
        scrollToBottom();
        updateSendBtn();
      });
      if (!state.stopRequested) {
        const finalText = (acc || '').trim();
        cursor.remove();
        setBubbleContent(wrap._bubble, 'assistant', finalText || '(no response)');
        state.messages.push({ role: 'assistant', content: finalText, modelLabel: MODELS[modelKeyAtStart].label });
        renderMsgCount();
        persistCurrentChat();
      }
    } catch (err) {
      if (!state.stopRequested) {
        cursor.remove();
        setBubbleContent(wrap._bubble, 'assistant', acc ? acc + '\n\n[generation failed]' : 'Something went wrong.');
        state.messages.push({ role: 'assistant', content: acc.trim() || '(failed)', modelLabel: MODELS[modelKeyAtStart] ? MODELS[modelKeyAtStart].label : undefined });
        renderMsgCount();
        persistCurrentChat();
      }
    } finally {
      currentGenWrap = null;
      state.generating = false;
      updateSendBtn();
    }
  }

  function regenerateMessage(wrap) {
    if (state.generating) return;
    const idx = findMsgIndex(wrap);
    if (idx === -1 || idx >= state.messages.length) return;
    // Remove this message and everything after it
    state.messages.splice(idx);
    const bubbles = chatScroll.querySelectorAll('.msg');
    for (let i = idx; i < bubbles.length; i++) bubbles[i].remove();
    renderMsgCount();
    // Re-send from the previous user message
    const lastUserIdx = state.messages.map((m) => m.role).lastIndexOf('user');
    if (lastUserIdx === -1) return;
    doSendWithHistory(lastUserIdx);
  }

  /* --------------------------- Chat history (sidebar) ---------------------- */
  // Conversations are stored client-side only, in localStorage.

  function loadChatsFromStorage() {
    try {
      const raw = localStorage.getItem(CHATS_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  }

  function saveChatsToStorage() {
    try { localStorage.setItem(CHATS_KEY, JSON.stringify(state.chats)); } catch { /* storage unavailable; ignore */ }
  }

  function makeChatId() {
    return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function titleForChat(chat) {
    if (chat.title) return chat.title;
    const firstUser = chat.messages.find((m) => m.role === 'user');
    if (!firstUser) return 'New chat';
    const t = firstUser.content.trim().replace(/\s+/g, ' ');
    return t.length > 42 ? t.slice(0, 42) + '…' : t;
  }

  function findChat(id) {
    return state.chats.find((c) => c.id === id) || null;
  }

  function sortChatsByRecency() {
    state.chats.sort((a, b) => b.updatedAt - a.updatedAt);
  }

  function renderChatList() {
    chatList.innerHTML = '';
    if (!state.chats.length) {
      const empty = document.createElement('div');
      empty.className = 'chat-list-empty';
      empty.textContent = 'No chats yet';
      chatList.appendChild(empty);
      return;
    }
    state.chats.forEach((chat) => {
      const item = document.createElement('div');
      item.className = 'chat-list-item' + (chat.id === state.chatId ? ' active' : '');
      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = titleForChat(chat);
      const del = document.createElement('span');
      del.className = 'del';
      del.textContent = '✕';
      del.title = 'Delete chat';
      let confirming = false;
      let revertTimer = null;
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!confirming) {
          confirming = true;
          del.classList.add('confirm');
          del.textContent = '✓';
          del.title = 'Click again to delete';
          revertTimer = setTimeout(() => {
            confirming = false;
            del.classList.remove('confirm');
            del.textContent = '✕';
            del.title = 'Delete chat';
          }, 2200);
          return;
        }
        clearTimeout(revertTimer);
        deleteChatById(chat.id);
      });
      item.appendChild(title);
      item.appendChild(del);
      item.addEventListener('click', () => switchToChat(chat.id));
      chatList.appendChild(item);
    });
  }

  function loadChatIntoView(chat) {
    state.chatId = chat.id;
    state.messages = chat.messages.map((m) => ({ role: m.role, content: m.content, modelLabel: m.modelLabel }));
    chatScroll.querySelectorAll('.msg').forEach((n) => n.remove());
    if (state.messages.length) {
      chatEmpty.style.display = 'none';
      state.messages.forEach((m) => {
        addMessageBubble(m.role, m.content, m.role === 'assistant' ? (m.modelLabel || (MODELS[chat.modelKey] ? MODELS[chat.modelKey].label : '')) : undefined);
      });
    } else {
      chatEmpty.style.display = '';
    }
    renderMsgCount();
  }

  function switchToChat(id) {
    if (state.generating || id === state.chatId) { renderChatList(); return; }
    const chat = findChat(id);
    if (!chat) return;
    if (MODELS[chat.modelKey]) {
      state.modelKey = chat.modelKey;
      renderModelOptions();
      updateSendBtn();
      if (!state.pipelinesReady[chat.modelKey] && state.loading !== chat.modelKey) ensureModel(chat.modelKey).catch(() => {});
    }
    loadChatIntoView(chat);
    renderChatList();
  }

  function createNewChat() {
    if (state.generating) return;
    const chat = {
      id: makeChatId(),
      title: null,
      messages: [],
      modelKey: state.modelKey,
      createdAt: Date.now(),
      updatedAt: Date.now(),
    };
    state.chats.unshift(chat);
    saveChatsToStorage();
    loadChatIntoView(chat);
    renderChatList();
  }

  function persistCurrentChat() {
    let chat = findChat(state.chatId);
    if (!chat) {
      chat = { id: state.chatId || makeChatId(), title: null, messages: [], modelKey: state.modelKey, createdAt: Date.now(), updatedAt: Date.now() };
      state.chatId = chat.id;
      state.chats.unshift(chat);
    }
    chat.messages = state.messages.map((m) => ({ role: m.role, content: m.content, modelLabel: m.modelLabel }));
    chat.modelKey = state.modelKey;
    chat.updatedAt = Date.now();
    if (!chat.title) chat.title = titleForChat(chat) !== 'New chat' ? titleForChat(chat) : null;
    sortChatsByRecency();
    saveChatsToStorage();
    renderChatList();
  }

  function deleteChatById(id) {
    const idx = state.chats.findIndex((c) => c.id === id);
    if (idx === -1) return;
    state.chats.splice(idx, 1);
    saveChatsToStorage();
    if (state.chatId === id) {
      if (state.chats.length) {
        loadChatIntoView(state.chats[0]);
      } else {
        createNewChat();
        return;
      }
    }
    renderChatList();
  }

  function deleteAllChats() {
    state.chats = [];
    saveChatsToStorage();
    createNewChat();
  }

  function initChats() {
    state.chats = loadChatsFromStorage();
    sortChatsByRecency();
    if (state.chats.length) {
      loadChatIntoView(state.chats[0]);
      if (MODELS[state.chats[0].modelKey]) state.modelKey = state.chats[0].modelKey;
    } else {
      const chat = { id: makeChatId(), title: null, messages: [], modelKey: state.modelKey, createdAt: Date.now(), updatedAt: Date.now() };
      state.chats.unshift(chat);
      saveChatsToStorage();
      loadChatIntoView(chat);
    }
    renderChatList();
  }

  newChatBtn.addEventListener('click', createNewChat);

  let deleteAllConfirming = false;
  let deleteAllTimer = null;
  deleteAllChatsBtn.addEventListener('click', () => {
    if (!deleteAllConfirming) {
      deleteAllConfirming = true;
      deleteAllChatsBtn.classList.add('confirm');
      deleteAllChatsBtn.textContent = 'Click again to confirm';
      deleteAllTimer = setTimeout(() => {
        deleteAllConfirming = false;
        deleteAllChatsBtn.classList.remove('confirm');
        deleteAllChatsBtn.textContent = 'Delete all chats';
      }, 2600);
      return;
    }
    clearTimeout(deleteAllTimer);
    deleteAllConfirming = false;
    deleteAllChatsBtn.classList.remove('confirm');
    deleteAllChatsBtn.textContent = 'Delete all chats';
    settingsPanel.classList.remove('open');
    deleteAllChats();
  });

  function updateThinkingModeBtn() {
    thinkingModeBtn.textContent = 'Thinking mode: ' + (state.thinkingEnabled ? 'On' : 'Off');
    thinkingModeBtn.classList.toggle('primary', state.thinkingEnabled);
  }
  thinkingModeBtn.addEventListener('click', () => {
    state.thinkingEnabled = !state.thinkingEnabled;
    try { localStorage.setItem(THINKING_MODE_KEY, state.thinkingEnabled ? '1' : '0'); } catch { /* ignore */ }
    updateThinkingModeBtn();
  });

  const systemPromptInput = $('#systemPromptInput');
  const saveSystemPromptBtn = $('#saveSystemPromptBtn');
  systemPromptInput.value = userSystemPrompt || SYSTEM_PROMPT_DEFAULT;
  saveSystemPromptBtn.addEventListener('click', () => {
    userSystemPrompt = systemPromptInput.value.trim() || null;
    try { localStorage.setItem(SYSTEM_PROMPT_KEY, userSystemPrompt || ''); } catch {}
    flashSendBtn('System prompt saved', 1400);
  });

  sidebarCollapseBtn.addEventListener('click', () => {
    document.getElementById('app').classList.add('sidebar-collapsed');
  });
  sidebarExpandBtn.addEventListener('click', () => {
    document.getElementById('app').classList.remove('sidebar-collapsed');
  });

  /* ------------------------------ Composer --------------------------------- */

  function autoGrow() {
    composerInput.style.height = 'auto';
    composerInput.style.height = Math.min(200, composerInput.scrollHeight) + 'px';
  }
  composerInput.addEventListener('input', autoGrow);
  composerInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendOrStop();
    }
  });

  let currentGenWrap = null;

  function sendOrStop() {
    if (state.generating) {
      stopGenerating();
      return;
    }
    doSend();
  }
  sendBtn.addEventListener('click', sendOrStop);

  function stopGenerating() {
    // transformers.js doesn't expose a mid-stream abort.  The reliable way
    // to stop generation is to discard the worker producing it.  The model
    // is cached after the first download, so reloading into a fresh worker
    // is fast.
    state.stopRequested = true;
    worker.terminate();
    worker = makeWorker();
    state.pipelinesReady = {};
    // pendingGen.clear() drops in-flight resolvers without calling
    // resolve/reject, so doSend()'s await hangs forever.  This is the only
    // place a stopped turn gets recorded.  Every model enforces strict
    // user/assistant alternation, and doSend() already pushed the user
    // message, so a partial reply (or placeholder) is saved as the
    // assistant turn.
    pendingGen.clear();
    if (currentGenWrap && currentGenWrap._bubble) {
      // Read _rawText (markdown source), not .textContent.  Once replies are
      // markdown-rendered, .textContent strips syntax (e.g. "**hi**" reads
      // back as just "hi").
      const partial = currentGenWrap._rawText || '';
      setBubbleContent(currentGenWrap._bubble, 'assistant', partial + ' [stopped]');
      const m = MODELS[state.modelKey];
      state.messages.push({
        role: 'assistant',
        content: partial.trim() || '(stopped before any reply)',
        modelLabel: m ? m.label : undefined,
      });
      renderMsgCount();
      persistCurrentChat();
    }
    state.generating = false;
    updateSendBtn();
    ensureModel(state.modelKey).catch(() => {});
  }

  async function doSend() {
    const text = composerInput.value.trim();
    if (!text || state.generating) return;
    if (text.length > MAX_INPUT_LENGTH) {
      flashSendBtn('Message too long', 1600);
      return;
    }
    composerInput.value = '';
    autoGrow();

    addMessageBubble('user', text);
    state.messages.push({ role: 'user', content: text });
    renderMsgCount();
    persistCurrentChat();

    // ---- Heuristic pre-routing for local tools ----
    // Deterministic tools that offload work the 1B model would hallucinate.
    // Tool result is injected as context and shown as a visible bubble.
    const route = heuristicRoute(text);
    let toolContext = null;
    if (route.handled) {
      let toolResult = '';
      let toolLabel = '';
      try {
        if (route.handled === 'math') {
          const r = await evalMath(route.raw);
          toolResult = r.error ? `I couldn't evaluate that: ${r.error}` : `**${r.formatted}**`;
          toolLabel = ' (calculated)';
        } else if (route.handled === 'date') {
          const r = await parseDate(route.raw);
          toolResult = r.error ? `I couldn't parse that date: ${r.error}` : `**${r.formatted}** (${r.relative})`;
          toolLabel = ' (date parsed)';
        } else if (route.handled === 'count') {
          const textToCount = route.raw.replace(/\b(count|how\s+many|words?|chars?|characters?|sentences?|letters?|lines?|of|in|the|text|below)\b/gi, '').trim();
          const sample = textToCount || state.messages.filter((m) => m.role === 'user').pop()?.content || '';
          const c = countText(sample);
          toolResult = `**${c.words}** words, **${c.chars}** characters (${c.charsNoSpace} without spaces), **${c.sentences}** sentences, **${c.paragraphs}** paragraphs. ~${c.readingMin} min read.`;
          toolLabel = ' (counted)';
        } else if (route.handled === 'case') {
          const src = route.raw.replace(/\b(uppercase|lowercase|upper\s*case|lower\s*case|title\s*case|reverse|backwards|to\s+upper|to\s+lower|convert|make|the\s+text|below|this)\b/gi, '').trim();
          const sample = src || state.messages.filter((m) => m.role === 'user').pop()?.content || '';
          toolResult = '```\n' + convertCase(sample, route.mode) + '\n```';
          toolLabel = ' (converted)';
        } else if (route.handled === 'json') {
          const src = route.raw.replace(/\b(format|pretty|validate|check|json|the\s+text|below|this)\b/gi, '').trim();
          const r = formatJson(src);
          toolResult = r.valid ? '**Valid JSON:**\n```json\n' + r.formatted + '\n```' : '**Invalid JSON:** ' + r.error;
          toolLabel = ' (json)';
        } else if (route.handled === 'base64') {
          const isDecode = /\bdecode\b/i.test(route.raw);
          const src = route.raw.replace(/\b(base\s*64|encode|decode|the\s+text|below|this)\b/gi, '').trim();
          try {
            toolResult = isDecode ? '**Decoded:** ' + base64Decode(src) : '**Encoded:** `' + base64Encode(src) + '`';
          } catch (e) { toolResult = '**Error:** ' + e.message; }
          toolLabel = ' (base64)';
        } else if (route.handled === 'url') {
          const src = route.raw.replace(/\b(parse|extract|break\s+down|the\s+url|below|this)\b/gi, '').trim();
          const r = parseUrl(src);
          toolResult = r.error ? '**Error:** ' + r.error :
            `**Protocol:** ${r.protocol}\n**Host:** ${r.hostname}${r.port ? ':' + r.port : ''}\n**Path:** ${r.pathname}\n**Params:** ${Object.keys(r.params).length ? JSON.stringify(r.params) : 'none'}`;
          toolLabel = ' (url parsed)';
        } else if (route.handled === 'uuid') {
          const count = (route.raw.match(/\d+/) || [1])[0];
          const uuids = Array.from({ length: Math.min(10, Math.max(1, Number(count))) }, () => generateUuid());
          toolResult = '**Generated:**\n```\n' + uuids.join('\n') + '\n```';
          toolLabel = ' (uuid)';
        } else if (route.handled === 'hash') {
          const algo = route.raw.match(/sha-?512/i) ? 'sha512' : route.raw.match(/sha-?256/i) ? 'sha256' : route.raw.match(/md5/i) ? 'md5' : 'sha256';
          const src = route.raw.replace(/\b(hash|sha-?256|sha-?512|md5|encode|of|for|this|the\s+text|below)\b/gi, '').trim();
          const hash = await hashText(src, algo);
          toolResult = `**${algo.toUpperCase()}:** \`${hash}\``;
          toolLabel = ' (hashed)';
        } else if (route.handled === 'color') {
          const hex = route.raw.match(/#?[0-9a-f]{3,6}/i)?.[0] || '';
          const r = convertColor(hex);
          toolResult = r.error ? '**Error:** ' + r.error : `**HEX:** ${r.hex}\n**RGB:** ${r.rgb}\n**HSL:** ${r.hsl}`;
          toolLabel = ' (color)';
        } else if (route.handled === 'timestamp') {
          const r = convertTimestamp(route.raw);
          toolResult = r.error ? '**Error:** ' + r.error :
            `**Unix:** ${r.unix_s}s (${r.unix_ms}ms)\n**ISO:** ${r.iso}\n**Local:** ${r.local}${r.relative ? '\n**Relative:** ' + r.relative : ''}`;
          toolLabel = ' (timestamp)';
        } else if (route.handled === 'base') {
          const r = convertBase(route.raw);
          toolResult = r.error ? '**Error:** ' + r.error :
            `**Decimal:** ${r.decimal}\n**Binary:** ${r.binary}\n**Octal:** ${r.octal}\n**Hex:** ${r.hexadecimal}`;
          toolLabel = ' (converted)';
        } else if (route.handled === 'csv') {
          const src = route.raw.replace(/\b(csv\s+to\s+json|convert|parse|the\s+csv|below|this)\b/gi, '').trim();
          const r = csvToJson(src);
          toolResult = r.error ? '**Error:** ' + r.error : `**${r.count} rows:**\n\`\`\`json\n${r.json}\n\`\`\``;
          toolLabel = ' (csv)';
        } else if (route.handled === 'diff') {
          const parts = route.raw.split(/\n---+\n|\nvs\.?\n|\ndiff\n/i);
          if (parts.length >= 2) {
            const r = diffText(parts[0], parts.slice(1).join('\n'));
            toolResult = `**${r.additions} additions, ${r.removals} removals:**\n\`\`\`\n${r.diff}\n\`\`\``;
            toolLabel = ' (diff)';
          }
        } else if (route.handled === 'password') {
          const len = (route.raw.match(/\d+/) || [16])[0];
          const pw = generatePassword(Math.min(128, Math.max(8, Number(len))));
          toolResult = '**Generated password:**\n```\n' + pw + '\n```';
          toolLabel = ' (password)';
        }
      } catch (e) { toolResult = '**Tool error:** ' + e.message; }
      if (toolResult) {
        const m = MODELS[state.modelKey];
        addMessageBubble('assistant', toolResult, (m ? m.label : '') + toolLabel);
        toolContext = toolResult;
      }
    }

    renderMsgCount();
    persistCurrentChat();

    try {
      await ensureModel(state.modelKey);
    } catch (err) {
      const base = "Sorry, I couldn't load the AI model on this device.";
      const msg = (err && err.message) ? `${base}\n\n${err.message}` : base;
      addMessageBubble('assistant', msg, MODELS[state.modelKey].label);
      // Model load failed after user turn was pushed, need paired assistant
      // turn or next send pushes two consecutive user turns.
      state.messages.push({ role: 'assistant', content: msg, modelLabel: MODELS[state.modelKey].label });
      renderMsgCount();
      persistCurrentChat();
      return;
    }

    const modelKeyAtStart = state.modelKey;
    // Gemma 4's docs: thought traces from previous turns must not replayed
    // as history.  Stored messages keep full raw text (thinking block
    // included) for display, but only the answer portion goes over the wire.
    // splitThinking() is a no-op for messages without thinking blocks, so
    // this is safe for every model.
    const wireMessages = alternateMessages([
      { role: 'system', content: getSystemPrompt() },
      ...(toolContext ? [{ role: 'system', content: 'Tool answer for reference: ' + toolContext }] : []),
      ...buildContextMessages(state.messages).filter((m) => !m._tool).map((m) => ({
        role: m.role,
        content: m.role === 'assistant' ? (splitThinking(m.content).answer || m.content) : m.content,
      })),
    ]);
    // thinking is read by the worker for all models, safe to include.
    const genOpts = { max_new_tokens: MAX_NEW_TOKENS, temperature: 0.7, top_p: 0.9, do_sample: true, thinking: state.thinkingEnabled };

    state.generating = true;
    state.stopRequested = false;
    state.genTokens = 0;
    state.genMaxTokens = estimateOutputTokens(wireMessages, MAX_NEW_TOKENS);
    state.genStartedAt = Date.now();
    updateSendBtn();

    const wrap = addMessageBubble('assistant', '', MODELS[modelKeyAtStart].label);
    currentGenWrap = wrap;
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    wrap._bubble.appendChild(cursor);
    let acc = '';

    try {
      const text = await runGenerate(modelKeyAtStart, wireMessages, genOpts, (chunk) => {
        acc += chunk;
        state.genTokens += 1;
        wrap._rawText = acc;
        setBubbleContent(wrap._bubble, 'assistant', acc);
        wrap._bubble.appendChild(cursor);
        scrollToBottom();
        updateSendBtn();
      });
      if (!state.stopRequested) {
        const finalText = (text || acc || '').trim();
        cursor.remove();
        setBubbleContent(wrap._bubble, 'assistant', finalText || '(no response)');
        state.messages.push({ role: 'assistant', content: finalText, modelLabel: MODELS[modelKeyAtStart].label });
        renderMsgCount();
        persistCurrentChat();
      }
    } catch (err) {
      if (!state.stopRequested) {
        cursor.remove();
        console.error(err);
        const detail = (err && err.message) ? ` (${err.message})` : '';
        setBubbleContent(wrap._bubble, 'assistant', acc ? acc + '\n\n[generation failed' + detail + ']' : 'Something went wrong generating a reply.' + detail);
        // The user's turn was already pushed; without a paired assistant
        // turn the next send would push consecutive user turns and fail.
        state.messages.push({
          role: 'assistant',
          content: acc.trim() || '(reply failed to generate)',
          modelLabel: MODELS[modelKeyAtStart] ? MODELS[modelKeyAtStart].label : undefined,
        });
        renderMsgCount();
        persistCurrentChat();
      }
    } finally {
      currentGenWrap = null;
      state.generating = false;
      updateSendBtn();
    }
  }

  /* -------------------------------- Boot ------------------------------------ */  initChats();
  renderModelOptions();
  renderThemes();
  if (customAccent) applyAccentColor(customAccent);
  renderAccentRow();
  updateThinkingModeBtn();
  updateSendBtn();
  autoGrow();
  // Start fetching the default model so Send is usually instant by the time
  // someone actually types something.
  ensureModel(state.modelKey).catch(() => {});
})();

</script>
</body>
</html>
