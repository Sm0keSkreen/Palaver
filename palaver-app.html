<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Palaver — offline AI chat</title>
<style>
:root{
  /* Midnight (default): deep navy, monochrome blue — same palette as Emend */
  --bg:#080b11;
  --panel:#0d121a;
  --panel-2:#111826;
  --border:#1c2432;
  --text:#dde3ee;
  --text-dim:#78839a;
  --accent:#3e82f7;
  --accent-hover:#2f6fe0;
  --accent-soft:rgba(62,130,247,.14);
  --user-bubble:#1a2740;
  --assistant-bubble:#111826;
  --radius:8px;
  --font-ui:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:14.5px;
}

:root[data-theme="nord"]{
  --bg:#2e3440;
  --panel:#333a48;
  --panel-2:#3b4252;
  --border:#4c566a;
  --text:#eceff4;
  --text-dim:#9aa5b8;
  --accent:#5e81ac;
  --accent-hover:#81a1c1;
  --accent-soft:rgba(94,129,172,.2);
  --user-bubble:#434c5e;
  --assistant-bubble:#3b4252;
}

:root[data-theme="ocean"]{
  --bg:#0d1117;
  --panel:#111823;
  --panel-2:#161d29;
  --border:#21262d;
  --text:#e6edf3;
  --text-dim:#7d8590;
  --accent:#388bfd;
  --accent-hover:#58a6ff;
  --accent-soft:rgba(56,139,253,.15);
  --user-bubble:#1c2836;
  --assistant-bubble:#161d29;
}

:root[data-theme="sky"]{
  --bg:#f2f6fc;
  --panel:#ffffff;
  --panel-2:#edf2fa;
  --border:#d7e3f0;
  --text:#12203a;
  --text-dim:#5b6b82;
  --accent:#2f7de9;
  --accent-hover:#1d63c9;
  --accent-soft:rgba(47,125,233,.1);
  --user-bubble:#dce8fb;
  --assistant-bubble:#ffffff;
  color-scheme:light;
}

html{color-scheme:dark;}

::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim);}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
}
#app{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:row;
  position:relative;
}

/* ---------- Sidebar ---------- */
.sidebar{
  width:260px;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  background:var(--panel);
  border-right:1px solid var(--border);
  min-height:0;
  transition:margin-left .18s ease;
}
#app.sidebar-collapsed .sidebar{margin-left:-260px;}
.sidebar-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:12px 14px 8px;
  flex-shrink:0;
}
.sidebar-expand-btn{
  display:none;
  position:absolute;
  top:9px;
  left:10px;
  z-index:15;
}
#app.sidebar-collapsed .sidebar-expand-btn{display:inline-flex;}
.new-chat-btn{
  margin:4px 14px 10px;
  text-align:center;
  justify-content:center;
}
.chat-list{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:0 8px 10px;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.chat-list-empty{
  color:var(--text-dim);
  font-size:12px;
  text-align:center;
  padding:18px 10px;
}
.chat-list-item{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 9px;
  border-radius:7px;
  cursor:pointer;
  color:var(--text-dim);
}
.chat-list-item:hover{background:var(--panel-2);}
.chat-list-item.active{background:var(--accent-soft);color:var(--text);}
.chat-list-item .title{
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:12.5px;
}
.chat-list-item.active .title{color:var(--text);font-weight:600;}
.chat-list-item .del{
  flex-shrink:0;
  width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
  border-radius:5px;
  color:var(--text-dim);
  opacity:0;
  font-size:13px;
  line-height:1;
}
.chat-list-item:hover .del{opacity:1;}
.chat-list-item .del:hover{background:var(--border);color:var(--text);}
.chat-list-item .del.confirm{opacity:1;color:#e5534b;}

.btn.danger{border-color:#5a2a26;color:#e5534b;background:transparent;}
.btn.danger:hover{background:rgba(229,83,75,.12);}
.btn.danger.confirm{background:#e5534b;border-color:#e5534b;color:#fff;}

/* ---------- Main panel ---------- */
.main-panel{
  flex:1;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
}

/* ---------- Top bar ---------- */
.topbar{
  display:flex;
  align-items:center;
  gap:16px;
  padding:9px 18px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  flex-wrap:wrap;
  flex-shrink:0;
}
.brand{
  font-weight:600;
  font-size:14.5px;
  letter-spacing:.01em;
  white-space:nowrap;
  color:var(--text);
}

.topbar-spacer{flex:1;}

/* ---------- Buttons ---------- */
.btn{
  appearance:none;
  border:1px solid var(--border);
  background:var(--panel-2);
  color:var(--text);
  font:inherit;
  font-size:12.5px;
  font-weight:500;
  padding:6px 12px;
  border-radius:7px;
  cursor:pointer;
  white-space:nowrap;
}
.btn:hover{background:#161c27;border-color:#293140;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.small{padding:4px 9px;font-size:12px;}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
.btn.ghost:hover{background:var(--panel-2);color:var(--text);}

/* Progress-fill button (model loading / generating), same technique as Emend:
   a fill span behind the label, width driven by JS, so the button itself
   reads as a progress bar without any separate UI element. */
.ai-progress-btn{position:relative;overflow:hidden;}
.ai-progress-btn:disabled{cursor:default;}
.ai-progress-btn.busy:disabled{opacity:1;pointer-events:none;}
.ai-progress-fill{
  position:absolute;
  inset:0 auto 0 0;
  width:0%;
  background:var(--accent-hover);
  transition:width .25s ease;
  z-index:0;
}
.ai-progress-label{position:relative;z-index:1;white-space:nowrap;}

/* ---------- Dropdown menus (theme / model) ---------- */
.menu-wrap{position:relative;}
.dropdown-panel{
  display:none;
  position:absolute;
  top:calc(100% + 6px);
  right:0;
  min-width:260px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  box-shadow:0 12px 32px rgba(0,0,0,.35);
  z-index:20;
}
.dropdown-panel.open{display:block;}
.dropdown-panel .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.dropdown-panel .row:last-child{margin-bottom:0;}
.dropdown-panel .label{font-weight:600;font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
.model-panel{max-height:min(70vh,520px);overflow-y:auto;}
.debug-hint{font-size:10.5px;color:var(--text-dim);line-height:1.4;margin-top:2px;}

.theme-swatch{
  width:26px;height:26px;border-radius:50%;cursor:pointer;
  border:2px solid var(--border);background:var(--sw-bg);
  box-shadow:inset 0 0 0 8px var(--sw-accent);
}
.theme-swatch.selected{border-color:var(--accent);}

.chip{
  border:1px solid var(--border);
  background:var(--panel-2);
  color:var(--text-dim);
  font-size:12px;
  padding:5px 10px;
  border-radius:20px;
  cursor:pointer;
}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

.model-option{
  display:flex;
  flex-direction:column;
  gap:2px;
  border:1px solid var(--border);
  background:var(--panel-2);
  border-radius:8px;
  padding:8px 10px;
  cursor:pointer;
  width:100%;
}
.model-option.selected{border-color:var(--accent);}
.model-option.unavailable{opacity:.5;cursor:not-allowed;}
.model-option .name{font-weight:600;font-size:12.5px;color:var(--text);}
.model-option .meta{font-size:10.5px;color:var(--text-dim);}

/* ---------- Chat area ---------- */
.chat-wrap{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:0 18px;
}
.chat-scroll{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:20px 4px 12px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.chat-empty{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:var(--text-dim);
  text-align:center;
  padding:24px;
}
.chat-empty .big{font-size:16px;color:var(--text);font-weight:600;}

.msg{
  display:flex;
  gap:10px;
  max-width:78%;
}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg.assistant{align-self:flex-start;}
.msg .avatar{
  flex-shrink:0;
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;
  background:var(--panel-2);
  border:1px solid var(--border);
  color:var(--text-dim);
}
.msg.user .avatar{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.msg .bubble{
  background:var(--assistant-bubble);
  border:1px solid var(--border);
  border-radius:12px;
  padding:9px 13px;
  font-size:13.5px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}
.msg.user .bubble{background:var(--user-bubble);}
.msg .bubble .cursor{display:inline-block;width:7px;height:1em;background:var(--text-dim);vertical-align:text-bottom;margin-left:1px;animation:blink 1s step-start infinite;}
@keyframes blink{50%{opacity:0;}}
.msg .model-tag{font-size:10px;color:var(--text-dim);margin-top:4px;}

/* ---------- Composer ---------- */
.composer{
  flex-shrink:0;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:12px 4px 16px;
}
.composer textarea{
  flex:1;
  resize:none;
  min-height:22px;
  max-height:200px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 12px;
  color:var(--text);
  font:inherit;
  font-size:13.5px;
  line-height:1.5;
}
.composer textarea:focus{outline:none;border-color:var(--accent);}
.composer .btn{height:38px;}

.statusbar{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding:5px 18px;
  font-size:11px;
  color:var(--text-dim);
  border-top:1px solid var(--border);
  background:var(--panel);
}
.statusbar .statusbar-spacer{flex:1;}

</style>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">Palaver</div>
      <button class="btn ghost small" id="sidebarCollapseBtn" title="Collapse sidebar">‹</button>
    </div>
    <button class="btn primary new-chat-btn" id="newChatBtn">+ New chat</button>
    <div class="chat-list" id="chatList"></div>
  </aside>
  <button class="btn ghost small sidebar-expand-btn" id="sidebarExpandBtn" title="Show chats">›</button>

  <div class="main-panel">
    <header class="topbar">
      <div class="topbar-spacer"></div>

      <div class="menu-wrap model-wrap">
        <button class="btn ghost" id="modelToggleBtn">Model: <span id="modelBtnLabel">…</span></button>
        <div class="dropdown-panel model-panel" id="modelPanel">
          <div class="label">AI model</div>
          <div class="row" id="aiModelList"></div>
        </div>
      </div>

      <div class="menu-wrap settings-wrap">
        <button class="btn ghost" id="settingsToggleBtn">Settings</button>
        <div class="dropdown-panel settings-panel" id="settingsPanel">
          <div class="label">Theme</div>
          <div class="row" id="themeRow"></div>
          <div class="label">Chats</div>
          <div class="row">
            <button class="btn small danger" id="deleteAllChatsBtn">Delete all chats</button>
          </div>
          <div class="label">Debug</div>
          <div class="row">
            <button class="btn small" id="debugModeBtn">Debug mode: Off</button>
          </div>
          <div class="debug-hint">Shows the real error text (from the browser console) in chat and status messages instead of a generic failure message.</div>
        </div>
      </div>
    </header>

    <main class="chat-wrap">
      <div class="chat-scroll" id="chatScroll">
        <div class="chat-empty" id="chatEmpty">
          <div class="big">Start a conversation</div>
          <div>Pick a model up top, then say hello. Everything runs on-device — nothing leaves your browser.</div>
        </div>
      </div>

      <div class="composer">
        <textarea id="composerInput" rows="1" placeholder="Message Palaver…"></textarea>
        <button class="btn primary ai-progress-btn" id="sendBtn"><span class="ai-progress-fill" id="aiProgressFill"></span><span class="ai-progress-label" id="aiProgressLabel">Send</span></button>
      </div>
    </main>

    <div class="statusbar">
      <span id="engineStatus">Loading…</span>
      <div class="statusbar-spacer"></div>
      <span id="msgCount"></span>
    </div>
  </div>
</div>

<script>
/* Palaver: an offline AI chat. Every model runs entirely on-device via
   transformers.js — nothing you type ever leaves the browser. Model
   download and text generation both happen inside a dedicated Web Worker
   (same approach as Emend's AI Check), so the page stays responsive and can
   show live progress instead of freezing while the WASM/WebGPU backend does
   its (synchronous-feeling) heavy lifting. */
(() => {
  'use strict';

  const TRANSFORMERS_CDN = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0';

  // Mirror of a handful of models' weights, pre-split into <20MB chunks and
  // hosted in our own GitHub repo so jsDelivr can serve them — a fallback
  // path for anyone who can't reach huggingface.co directly. Only models
  // listed here (via `cdnFolder`) use it; everything else loads from HF
  // exactly as before. See palaver-models repo's onnx/*.manifest.json for
  // the chunk lists this depends on.
  const CDN_REPO = 'https://cdn.jsdelivr.net/gh/Sm0keSkreen/palaver-models@main/';

  const MODELS = {
    fast:      { id: 'onnx-community/Qwen2.5-0.5B-Instruct',              label: 'Fast',           meta: '~400MB · quickest replies',        dtype: 'q4' },
    gemma270m: { id: 'onnx-community/gemma-3-270m-it-ONNX',               label: 'Gemma 270M',     meta: '~320MB · Google, ultra-light',      dtype: 'q4', cdnFolder: 'gemma270m' },
    balanced:  { id: 'onnx-community/Llama-3.2-1B-Instruct-ONNX',         label: 'Balanced',       meta: '~800MB · Meta Llama 3.2',           dtype: 'q4', cdnFolder: 'balanced' },
    gemma1b:   { id: 'onnx-community/gemma-3-1b-it-ONNX',                 label: 'Gemma 1B',       meta: '~860MB · Google, newer arch',       dtype: 'q4', cdnFolder: 'gemma1b' },
    better:    { id: 'HuggingFaceTB/SmolLM2-1.7B-Instruct',               label: 'Better',         meta: '~1.4GB · well-rounded',             dtype: 'q4' },
    qwen15b:   { id: 'onnx-community/Qwen2.5-1.5B-Instruct',              label: 'Qwen 1.5B',      meta: '~1.8GB · Alibaba, well-rounded',    dtype: 'q4', cdnFolder: 'qwen15b' },
    deepseek:  { id: 'onnx-community/DeepSeek-R1-Distill-Qwen-1.5B-ONNX', label: 'DeepSeek R1 1.5B', meta: '~2.0GB · reasoning, slower replies', dtype: 'q4', cdnFolder: 'deepseek' },
    llama3b:   { id: 'onnx-community/Llama-3.2-3B-Instruct-ONNX',         label: 'Llama 3.2 3B',   meta: '~3.4GB · biggest, highest quality', dtype: 'q4' },
    lfm2_1b:   { id: 'onnx-community/LFM2-1.2B-ONNX',                     label: 'LFM2 1.2B',      meta: '~700MB · Liquid AI, built for edge', dtype: 'q4' },
    lfm2_3b:   { id: 'onnx-community/LFM2-2.6B-ONNX',                     label: 'LFM2 2.6B',      meta: '~1.5GB · Liquid AI, beats Llama 3B', dtype: 'q4' },
  };
  const DEFAULT_MODEL = 'fast';

  const SYSTEM_PROMPT = 'You are Palaver, a helpful, friendly AI assistant. Keep replies clear and reasonably concise unless the user asks for more detail.';
  const MAX_NEW_TOKENS = 768;
  const MAX_INPUT_LENGTH = 8000;
  // How long a loaded model sits idle (no generation, no new load) before its
  // worker is discarded to free WASM/GPU memory. 0 means "unload as soon as
  // it's not being used" — the check still runs via setTimeout so it fires
  // right after the current call stack clears (letting the UI update first),
  // not literally mid-function. The browser cache keeps the weights, so the
  // next message just reloads into a fresh worker quickly — it's not a
  // re-download, same as the existing stop/fail recovery paths.
  const IDLE_UNLOAD_MS = 0;

  const THEMES = [
    { id: 'midnight', label: 'Midnight', bg: '#080b11', accent: '#3e82f7' },
    { id: 'nord', label: 'Nord', bg: '#2e3440', accent: '#5e81ac' },
    { id: 'ocean', label: 'Ocean', bg: '#0d1117', accent: '#388bfd' },
    { id: 'sky', label: 'Sky', bg: '#f2f6fc', accent: '#2f7de9' },
  ];

  const $ = (s) => document.querySelector(s);
  const modelToggleBtn = $('#modelToggleBtn');
  const modelBtnLabel = $('#modelBtnLabel');
  const modelPanel = $('#modelPanel');
  const modelList = $('#aiModelList');
  const settingsToggleBtn = $('#settingsToggleBtn');
  const settingsPanel = $('#settingsPanel');
  const themeRow = $('#themeRow');
  const deleteAllChatsBtn = $('#deleteAllChatsBtn');
  const debugModeBtn = $('#debugModeBtn');
  const sidebar = $('#sidebar');
  const sidebarCollapseBtn = $('#sidebarCollapseBtn');
  const sidebarExpandBtn = $('#sidebarExpandBtn');
  const newChatBtn = $('#newChatBtn');
  const chatList = $('#chatList');
  const chatScroll = $('#chatScroll');
  const chatEmpty = $('#chatEmpty');
  const composerInput = $('#composerInput');
  const sendBtn = $('#sendBtn');
  const aiProgressFill = $('#aiProgressFill');
  const aiProgressLabel = $('#aiProgressLabel');
  const engineStatus = $('#engineStatus');
  const msgCount = $('#msgCount');

  const SKIP_KEY_PREFIX = 'palaver-ai-skip-';
  const CHATS_KEY = 'palaver-chats-v1';
  const DEBUG_MODE_KEY = 'palaver-debug-mode';

  const state = {
    modelKey: DEFAULT_MODEL,
    chats: [],              // [{id, title, messages, modelKey, createdAt, updatedAt}], most-recent-first
    chatId: null,
    unavailable: {},       // modelKey -> true once confirmed to fail on this device
    pipelinesReady: {},
    loadPromises: {},
    loading: null,
    loadingPct: null,
    loadStartedAt: null,
    loadError: null,
    lastErrorMessage: null, // raw error text from the worker, for debug mode
    generating: false,
    genTokens: 0,
    genMaxTokens: 0,
    genStartedAt: null,
    messages: [],           // {role:'user'|'assistant', content, modelLabel?}
    stopRequested: false,
    debugMode: false,       // when on, show real error text instead of a generic message
  };

  try {
    Object.keys(MODELS).forEach((k) => {
      if (sessionStorage.getItem(SKIP_KEY_PREFIX + k) === '1') state.unavailable[k] = true;
    });
    if (state.unavailable[state.modelKey]) {
      const firstOk = Object.keys(MODELS).find((k) => !state.unavailable[k]);
      if (firstOk) state.modelKey = firstOk;
    }
  } catch { /* storage unavailable; ignore */ }

  try {
    state.debugMode = localStorage.getItem(DEBUG_MODE_KEY) === '1';
  } catch { /* storage unavailable; ignore */ }

  /* --------------------------- Worker plumbing --------------------------- */
  const WORKER_SRC = `
    let transformersMod = null;
    const pipelines = {};
    let devicePromise = null;
    let jsDelivrCache = null;

    const HF_REMOTE_HOST = 'https://huggingface.co/';
    const HF_REMOTE_PATH_TEMPLATE = '{model}/resolve/{revision}/';

    async function pickDevice() {
      if (!('gpu' in self.navigator)) return 'wasm';
      try {
        const adapter = await self.navigator.gpu.requestAdapter();
        return adapter ? 'webgpu' : 'wasm';
      } catch {
        return 'wasm';
      }
    }

    // Model weight URLs always look like ".../onnx/<name>.onnx" or
    // ".../onnx/<name>.onnx_data[_N]" — the only files that are ever split
    // into chunks in the CDN mirror. Everything else (tokenizer.json,
    // config.json, etc.) is a normal single small file.
    function looksLikeModelWeightFile(url) {
      return /\\/onnx\\/[^/]+\\.onnx(_data(_\\d+)?)?$/.test(url);
    }

    async function sha256Hex(buf) {
      const digest = await crypto.subtle.digest('SHA-256', buf);
      return [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, '0')).join('');
    }

    // A Cache-API-shaped object (match/put) that transformers.js will use
    // in place of its own browser cache when loading from the CDN mirror.
    // For ordinary small files it's a thin pass-through to a real Cache
    // Storage bucket. For a chunked weight file (recognized by a sibling
    // "<file>.manifest.json"), it lazily fetches each chunk, verifies its
    // SHA-256 against the manifest, and streams the bytes back so
    // transformers.js's own download-progress UI keeps working — then
    // stashes the fully-assembled file in the real cache in the background
    // so the next load of the same model is instant.
    function getJsDelivrCache() {
      if (jsDelivrCache) return jsDelivrCache;
      const realCachePromise = ('caches' in self)
        ? self.caches.open('palaver-jsdelivr-v1').catch(() => null)
        : Promise.resolve(null);
      jsDelivrCache = {
        async match(key) {
          const realCache = await realCachePromise;
          if (realCache) {
            try {
              const hit = await realCache.match(key);
              if (hit) return hit;
            } catch { /* ignore cache read errors */ }
          }
          if (!looksLikeModelWeightFile(key)) return undefined;
          let manifest;
          try {
            const mRes = await fetch(key + '.manifest.json');
            if (!mRes.ok) return undefined; // not a chunked file — fall through to a normal fetch
            manifest = await mRes.json();
          } catch {
            return undefined;
          }
          const baseUrl = key.slice(0, key.lastIndexOf('/') + 1);
          const collected = [];
          let idx = 0;
          const stream = new ReadableStream({
            async pull(controller) {
              if (idx >= manifest.parts.length) {
                controller.close();
                realCachePromise.then(async (cacheToStore) => {
                  if (!cacheToStore) return;
                  try {
                    const fullBlob = new Blob(collected);
                    await cacheToStore.put(key, new Response(fullBlob, {
                      headers: { 'content-length': String(manifest.totalSize), 'content-type': 'application/octet-stream' },
                    }));
                  } catch { /* best-effort caching only */ }
                });
                return;
              }
              const part = manifest.parts[idx++];
              try {
                const res = await fetch(baseUrl + part.name);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const buf = new Uint8Array(await res.arrayBuffer());
                const hash = await sha256Hex(buf.buffer);
                if (hash !== part.sha256) throw new Error('checksum mismatch for ' + part.name);
                collected.push(buf);
                controller.enqueue(buf);
              } catch (err) {
                controller.error(new Error('CDN chunk fetch failed (' + part.name + '): ' + err.message));
              }
            },
          });
          return new Response(stream, {
            headers: { 'content-length': String(manifest.totalSize), 'content-type': 'application/octet-stream' },
          });
        },
        async put(key, response) {
          const realCache = await realCachePromise;
          if (!realCache) return;
          try { await realCache.put(key, response); } catch { /* best-effort caching only */ }
        },
      };
      return jsDelivrCache;
    }

    async function loadPipeline(modelId, dtype, device, cdnFolder, onProgress) {
      if (!transformersMod) {
        transformersMod = await import(${JSON.stringify(TRANSFORMERS_CDN)});
        // Forcing single-threaded WASM avoids onnxruntime-web sizing its
        // memory arena for a cross-origin-isolated thread count that isn't
        // actually available, which otherwise fails the very first
        // allocation on machines with plenty of free RAM.
        transformersMod.env.backends.onnx.wasm.numThreads = 1;
      }
      let pipelineModelId = modelId;
      if (cdnFolder) {
        transformersMod.env.remoteHost = ${JSON.stringify(CDN_REPO)};
        transformersMod.env.remotePathTemplate = '{model}/';
        transformersMod.env.useCustomCache = true;
        transformersMod.env.customCache = getJsDelivrCache();
        pipelineModelId = cdnFolder;
      } else {
        transformersMod.env.remoteHost = HF_REMOTE_HOST;
        transformersMod.env.remotePathTemplate = HF_REMOTE_PATH_TEMPLATE;
        transformersMod.env.useCustomCache = false;
        transformersMod.env.customCache = null;
      }
      return transformersMod.pipeline('text-generation', pipelineModelId, {
        dtype, device, progress_callback: onProgress,
      });
    }

    self.onmessage = async (e) => {
      const msg = e.data;
      if (msg.type === 'loadModel') {
        const { key, modelId, dtype, cdnFolder } = msg;
        try {
          if (!devicePromise) devicePromise = pickDevice();
          let device = await devicePromise;
          const files = {};
          const onProgress = (p) => {
            if (p.status === 'progress' && p.file) {
              files[p.file] = p;
              let loaded = 0, total = 0;
              for (const f of Object.values(files)) { loaded += f.loaded || 0; total += f.total || 0; }
              self.postMessage({ type: 'loadProgress', key, pct: total ? Math.round((loaded / total) * 100) : 0 });
            }
          };
          let generator;
          try {
            generator = await loadPipeline(modelId, dtype, device, cdnFolder, onProgress);
          } catch (err) {
            if (device !== 'wasm') {
              device = 'wasm';
              generator = await loadPipeline(modelId, dtype, 'wasm', cdnFolder, onProgress);
            } else {
              throw err;
            }
          }
          pipelines[key] = generator;
          self.postMessage({ type: 'loadDone', key });
        } catch (err) {
          self.postMessage({ type: 'loadError', key, message: String((err && err.message) || err) });
        }
      } else if (msg.type === 'generate') {
        const { reqId, key, messages, genOpts } = msg;
        try {
          const pipe = pipelines[key];
          if (!pipe) throw new Error('model not loaded: ' + key);
          const streamer = new transformersMod.TextStreamer(pipe.tokenizer, {
            skip_prompt: true,
            skip_special_tokens: true,
            callback_function: (chunk) => {
              self.postMessage({ type: 'genChunk', reqId, text: chunk });
            },
          });
          const result = await pipe(messages, Object.assign({}, genOpts, { streamer }));
          let text = result && result[0] && result[0].generated_text;
          if (Array.isArray(text)) text = (text[text.length - 1] && text[text.length - 1].content) || '';
          self.postMessage({ type: 'genDone', reqId, text });
        } catch (err) {
          self.postMessage({ type: 'genError', reqId, message: String((err && err.message) || err) });
        }
      }
    };
  `;

  let worker = null;
  let workerReqSeq = 0;
  const pendingGen = new Map(); // reqId -> { resolve, reject, onChunk }

  let idleUnloadTimer = null;
  function cancelIdleUnloadTimer() {
    if (idleUnloadTimer) { clearTimeout(idleUnloadTimer); idleUnloadTimer = null; }
  }
  function resetIdleUnloadTimer() {
    cancelIdleUnloadTimer();
    idleUnloadTimer = setTimeout(unloadIdleModel, IDLE_UNLOAD_MS);
  }
  function unloadIdleModel() {
    idleUnloadTimer = null;
    // Never discard a worker that's mid-load or mid-generation — just push
    // the check out and try again once whatever's running settles.
    if (state.generating || state.loading) { resetIdleUnloadTimer(); return; }
    const resident = Object.keys(state.pipelinesReady).find((k) => state.pipelinesReady[k]);
    if (!resident) return; // nothing loaded, nothing to free
    worker.terminate();
    worker = makeWorker();
    state.pipelinesReady = {};
    renderModelOptions();
    updateSendBtn();
  }

  function makeWorker() {
    // Every replacement worker starts with a clean slate, so any pending
    // idle-unload check from the worker being replaced is stale.
    cancelIdleUnloadTimer();
    const blob = new Blob([WORKER_SRC], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    const w = new Worker(url, { type: 'module' });
    URL.revokeObjectURL(url);
    w.onmessage = onWorkerMessage;
    w.onerror = (err) => {
      console.error('AI worker error:', err);
      state.lastErrorMessage = (err && (err.message || String(err))) || 'Unknown worker error';
    };
    return w;
  }
  worker = makeWorker();

  function onWorkerMessage(e) {
    const msg = e.data;
    if (msg.type === 'loadProgress') {
      if (state.loading === msg.key) { state.loadingPct = msg.pct; updateSendBtn(); }
    } else if (msg.type === 'loadDone') {
      state.pipelinesReady[msg.key] = true;
      resetIdleUnloadTimer();
      settleLoad(msg.key, null);
    } else if (msg.type === 'loadError') {
      settleLoad(msg.key, msg.message);
    } else if (msg.type === 'genChunk') {
      const p = pendingGen.get(msg.reqId);
      if (p) p.onChunk(msg.text);
    } else if (msg.type === 'genDone') {
      const p = pendingGen.get(msg.reqId);
      if (p) { pendingGen.delete(msg.reqId); p.resolve(msg.text); }
    } else if (msg.type === 'genError') {
      const p = pendingGen.get(msg.reqId);
      if (p) { pendingGen.delete(msg.reqId); p.reject(new Error(msg.message)); }
    }
  }

  const loadResolvers = {};
  function settleLoad(key, errMessage) {
    const resolver = loadResolvers[key];
    delete loadResolvers[key];
    if (errMessage) {
      state.lastErrorMessage = errMessage;
      // A model can fail outright on a device whose real memory is smaller
      // than the model needs. A failed WASM allocation leaves
      // onnxruntime-web's memory maxed out (WebAssembly.Memory can grow but
      // never shrink), so trying anything else in that SAME worker would
      // fail identically. Ditch the poisoned worker for a fresh one.
      console.warn(`Model "${key}" failed to load; marking unavailable:`, errMessage);
      state.unavailable[key] = true;
      try { sessionStorage.setItem(SKIP_KEY_PREFIX + key, '1'); } catch { /* ignore */ }
      worker.terminate();
      worker = makeWorker();
      state.pipelinesReady = {};
      renderModelOptions();
      if (state.modelKey === key) {
        const fallback = Object.keys(MODELS).find((k) => !state.unavailable[k]);
        if (fallback) {
          state.modelKey = fallback;
          renderModelOptions();
          ensureModel(fallback).then(
            () => { if (resolver) resolver.resolve(); },
            (err) => { if (resolver) resolver.reject(err); },
          );
          return;
        }
      }
      state.loadError = key;
      updateSendBtn();
      if (resolver) resolver.reject(new Error(errMessage));
      return;
    }
    if (resolver) resolver.resolve();
  }

  function ensureModel(key) {
    if (state.pipelinesReady[key]) return Promise.resolve();
    if (state.loadPromises[key]) return state.loadPromises[key];

    // Keep at most one model resident at a time. Every pipeline that loads
    // successfully stays in the worker's memory until the worker is
    // discarded — loading a second model on top of an already-loaded one
    // is exactly what pushes total WASM/GPU memory over a device's ceiling.
    // Free whatever's currently loaded before pulling in a different model.
    const otherResident = Object.keys(state.pipelinesReady).find((k) => state.pipelinesReady[k] && k !== key);
    if (otherResident) {
      Object.keys(loadResolvers).forEach((k) => {
        const r = loadResolvers[k];
        delete loadResolvers[k];
        if (r) r.reject(new Error('cancelled: switching models'));
      });
      worker.terminate();
      worker = makeWorker();
      state.pipelinesReady = {};
    }

    const m = MODELS[key];
    state.loading = key;
    state.loadingPct = null;
    state.loadStartedAt = Date.now();
    state.loadError = null;
    updateSendBtn();
    const promise = new Promise((resolve, reject) => { loadResolvers[key] = { resolve, reject }; });
    worker.postMessage({ type: 'loadModel', key, modelId: m.id, dtype: m.dtype, cdnFolder: m.cdnFolder || null });
    const tracked = promise.finally(() => {
      if (state.loading === key) state.loading = null;
      delete state.loadPromises[key];
      updateSendBtn();
    });
    state.loadPromises[key] = tracked;
    return tracked;
  }

  function runGenerate(key, messages, genOpts, onChunk) {
    return new Promise((resolve, reject) => {
      const reqId = ++workerReqSeq;
      pendingGen.set(reqId, { resolve, reject, onChunk });
      worker.postMessage({ type: 'generate', reqId, key, messages, genOpts });
    });
  }

  /* -------------------------------- UI ------------------------------------ */

  function renderModelOptions() {
    modelList.innerHTML = '';
    Object.entries(MODELS).forEach(([key, m]) => {
      const unavailable = !!state.unavailable[key];
      const div = document.createElement('div');
      div.className = 'model-option'
        + (state.modelKey === key ? ' selected' : '')
        + (unavailable ? ' unavailable' : '');
      div.innerHTML = `<span class="name">${m.label}</span><span class="meta">${unavailable ? 'Unavailable on this device' : m.meta}</span>`;
      div.addEventListener('click', () => selectModel(key));
      modelList.appendChild(div);
    });
    modelBtnLabel.textContent = MODELS[state.modelKey].label;
  }

  function selectModel(key) {
    if (state.unavailable[key]) {
      flashSendBtn("That model isn't supported on this device.");
      return;
    }
    state.modelKey = key;
    renderModelOptions();
    updateSendBtn();
    if (!state.pipelinesReady[key] && state.loading !== key) ensureModel(key).catch(() => {});
  }

  function renderThemes() {
    themeRow.innerHTML = '';
    const current = document.documentElement.dataset.theme || 'midnight';
    THEMES.forEach((t) => {
      const btn = document.createElement('button');
      btn.className = 'theme-swatch' + (t.id === current ? ' selected' : '');
      btn.title = t.label;
      btn.style.setProperty('--sw-bg', t.bg);
      btn.style.setProperty('--sw-accent', t.accent);
      btn.addEventListener('click', () => {
        document.documentElement.dataset.theme = t.id;
        renderThemes();
      });
      themeRow.appendChild(btn);
    });
  }

  modelToggleBtn.addEventListener('click', () => {
    modelPanel.classList.toggle('open');
    settingsPanel.classList.remove('open');
  });
  settingsToggleBtn.addEventListener('click', () => {
    settingsPanel.classList.toggle('open');
    modelPanel.classList.remove('open');
  });
  document.addEventListener('click', (e) => {
    const path = e.composedPath();
    if (!path.includes(modelToggleBtn) && !path.includes(modelPanel)) modelPanel.classList.remove('open');
    if (!path.includes(settingsToggleBtn) && !path.includes(settingsPanel)) settingsPanel.classList.remove('open');
  });

  function flashSendBtn(message, ms = 2200) {
    setProgressFill(0);
    aiProgressLabel.textContent = message;
    setTimeout(updateSendBtn, ms);
  }

  function setProgressFill(pct) {
    sendBtn.classList.toggle('busy', pct != null && pct > 0);
    aiProgressFill.style.width = (pct == null ? 0 : Math.max(0, Math.min(100, pct))) + '%';
  }

  function estimateOutputTokens(messages, maxTokens) {
    const totalChars = messages.reduce((n, m) => n + (m.content ? m.content.length : 0), 0);
    const approxInputTokens = Math.max(8, Math.ceil(totalChars / 4));
    const est = Math.ceil(Math.min(approxInputTokens * 0.8, 300));
    return Math.max(24, Math.min(maxTokens, est));
  }

  function estimateEtaSeconds(startedAt, pct) {
    if (!startedAt || pct == null || pct <= 0) return null;
    const elapsedSec = (Date.now() - startedAt) / 1000;
    const ratePerSec = pct / elapsedSec;
    if (!(ratePerSec > 0)) return null;
    return (100 - pct) / ratePerSec;
  }

  function formatEta(seconds) {
    if (seconds == null || !isFinite(seconds) || seconds < 0) return '';
    if (seconds < 1) return 'almost done';
    if (seconds < 60) return `~${Math.round(seconds)}s left`;
    const mins = Math.floor(seconds / 60);
    const secs = Math.round(seconds % 60);
    return `~${mins}m ${secs}s left`;
  }

  function updateSendBtn() {
    if (state.loading === state.modelKey) {
      sendBtn.disabled = true;
      const pct = state.loadingPct;
      setProgressFill(pct != null ? pct : 0);
      const eta = formatEta(estimateEtaSeconds(state.loadStartedAt, pct));
      aiProgressLabel.textContent = pct != null
        ? `Loading ${pct}%${eta ? ' · ' + eta : ''}`
        : 'Loading model…';
      engineStatus.textContent = `Downloading ${MODELS[state.modelKey].label}…`;
    } else if (state.generating) {
      sendBtn.disabled = false;
      const pct = state.genMaxTokens
        ? Math.min(99, Math.round((state.genTokens / state.genMaxTokens) * 100))
        : null;
      setProgressFill(pct != null ? pct : 0);
      aiProgressLabel.textContent = 'Stop';
      engineStatus.textContent = 'Generating…';
    } else if (state.loadError === state.modelKey && !state.pipelinesReady[state.modelKey]) {
      sendBtn.disabled = false;
      setProgressFill(0);
      aiProgressLabel.textContent = 'Retry';
      engineStatus.textContent = (state.debugMode && state.lastErrorMessage)
        ? `Model failed to load: ${state.lastErrorMessage}`
        : 'Model failed to load';
    } else {
      sendBtn.disabled = false;
      setProgressFill(0);
      aiProgressLabel.textContent = 'Send';
      engineStatus.textContent = state.pipelinesReady[state.modelKey]
        ? `Ready — ${MODELS[state.modelKey].label}`
        : 'Ready';
    }
  }

  /* ------------------------------ Chat log --------------------------------- */

  function scrollToBottom() {
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  function renderMsgCount() {
    const n = state.messages.length;
    msgCount.textContent = n ? `${n} message${n === 1 ? '' : 's'}` : '';
  }

  function addMessageBubble(role, initialText, modelLabel) {
    chatEmpty.style.display = 'none';
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? 'U' : 'P';
    const col = document.createElement('div');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = initialText || '';
    col.appendChild(bubble);
    if (role === 'assistant') {
      const tag = document.createElement('div');
      tag.className = 'model-tag';
      tag.textContent = modelLabel || '';
      col.appendChild(tag);
      wrap._tag = tag;
    }
    wrap.appendChild(avatar);
    wrap.appendChild(col);
    chatScroll.appendChild(wrap);
    wrap._bubble = bubble;
    scrollToBottom();
    return wrap;
  }

  /* --------------------------- Chat history (sidebar) ---------------------- */
  // Every conversation is stored client-side only, in localStorage — nothing
  // ever leaves the browser, same as the model inference itself.

  function loadChatsFromStorage() {
    try {
      const raw = localStorage.getItem(CHATS_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  }

  function saveChatsToStorage() {
    try { localStorage.setItem(CHATS_KEY, JSON.stringify(state.chats)); } catch { /* storage unavailable; ignore */ }
  }

  function makeChatId() {
    return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function titleForChat(chat) {
    if (chat.title) return chat.title;
    const firstUser = chat.messages.find((m) => m.role === 'user');
    if (!firstUser) return 'New chat';
    const t = firstUser.content.trim().replace(/\s+/g, ' ');
    return t.length > 42 ? t.slice(0, 42) + '…' : t;
  }

  function findChat(id) {
    return state.chats.find((c) => c.id === id) || null;
  }

  function sortChatsByRecency() {
    state.chats.sort((a, b) => b.updatedAt - a.updatedAt);
  }

  function renderChatList() {
    chatList.innerHTML = '';
    if (!state.chats.length) {
      const empty = document.createElement('div');
      empty.className = 'chat-list-empty';
      empty.textContent = 'No chats yet';
      chatList.appendChild(empty);
      return;
    }
    state.chats.forEach((chat) => {
      const item = document.createElement('div');
      item.className = 'chat-list-item' + (chat.id === state.chatId ? ' active' : '');
      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = titleForChat(chat);
      const del = document.createElement('span');
      del.className = 'del';
      del.textContent = '✕';
      del.title = 'Delete chat';
      let confirming = false;
      let revertTimer = null;
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!confirming) {
          confirming = true;
          del.classList.add('confirm');
          del.textContent = '✓';
          del.title = 'Click again to delete';
          revertTimer = setTimeout(() => {
            confirming = false;
            del.classList.remove('confirm');
            del.textContent = '✕';
            del.title = 'Delete chat';
          }, 2200);
          return;
        }
        clearTimeout(revertTimer);
        deleteChatById(chat.id);
      });
      item.appendChild(title);
      item.appendChild(del);
      item.addEventListener('click', () => switchToChat(chat.id));
      chatList.appendChild(item);
    });
  }

  function loadChatIntoView(chat) {
    state.chatId = chat.id;
    state.messages = chat.messages.map((m) => ({ role: m.role, content: m.content, modelLabel: m.modelLabel }));
    chatScroll.querySelectorAll('.msg').forEach((n) => n.remove());
    if (state.messages.length) {
      chatEmpty.style.display = 'none';
      state.messages.forEach((m) => {
        addMessageBubble(m.role, m.content, m.role === 'assistant' ? (m.modelLabel || (MODELS[chat.modelKey] ? MODELS[chat.modelKey].label : '')) : undefined);
      });
    } else {
      chatEmpty.style.display = '';
    }
    renderMsgCount();
  }

  function switchToChat(id) {
    if (state.generating || id === state.chatId) { renderChatList(); return; }
    const chat = findChat(id);
    if (!chat) return;
    if (MODELS[chat.modelKey]) {
      state.modelKey = chat.modelKey;
      renderModelOptions();
      updateSendBtn();
      if (!state.pipelinesReady[chat.modelKey] && state.loading !== chat.modelKey) ensureModel(chat.modelKey).catch(() => {});
    }
    loadChatIntoView(chat);
    renderChatList();
  }

  function createNewChat() {
    if (state.generating) return;
    const chat = {
      id: makeChatId(),
      title: null,
      messages: [],
      modelKey: state.modelKey,
      createdAt: Date.now(),
      updatedAt: Date.now(),
    };
    state.chats.unshift(chat);
    saveChatsToStorage();
    loadChatIntoView(chat);
    renderChatList();
  }

  function persistCurrentChat() {
    let chat = findChat(state.chatId);
    if (!chat) {
      chat = { id: state.chatId || makeChatId(), title: null, messages: [], modelKey: state.modelKey, createdAt: Date.now(), updatedAt: Date.now() };
      state.chatId = chat.id;
      state.chats.unshift(chat);
    }
    chat.messages = state.messages.map((m) => ({ role: m.role, content: m.content, modelLabel: m.modelLabel }));
    chat.modelKey = state.modelKey;
    chat.updatedAt = Date.now();
    if (!chat.title) chat.title = titleForChat(chat) !== 'New chat' ? titleForChat(chat) : null;
    sortChatsByRecency();
    saveChatsToStorage();
    renderChatList();
  }

  function deleteChatById(id) {
    const idx = state.chats.findIndex((c) => c.id === id);
    if (idx === -1) return;
    state.chats.splice(idx, 1);
    saveChatsToStorage();
    if (state.chatId === id) {
      if (state.chats.length) {
        loadChatIntoView(state.chats[0]);
      } else {
        createNewChat();
        return;
      }
    }
    renderChatList();
  }

  function deleteAllChats() {
    state.chats = [];
    saveChatsToStorage();
    createNewChat();
  }

  function initChats() {
    state.chats = loadChatsFromStorage();
    sortChatsByRecency();
    if (state.chats.length) {
      loadChatIntoView(state.chats[0]);
      if (MODELS[state.chats[0].modelKey]) state.modelKey = state.chats[0].modelKey;
    } else {
      const chat = { id: makeChatId(), title: null, messages: [], modelKey: state.modelKey, createdAt: Date.now(), updatedAt: Date.now() };
      state.chats.unshift(chat);
      saveChatsToStorage();
      loadChatIntoView(chat);
    }
    renderChatList();
  }

  newChatBtn.addEventListener('click', createNewChat);

  let deleteAllConfirming = false;
  let deleteAllTimer = null;
  deleteAllChatsBtn.addEventListener('click', () => {
    if (!deleteAllConfirming) {
      deleteAllConfirming = true;
      deleteAllChatsBtn.classList.add('confirm');
      deleteAllChatsBtn.textContent = 'Click again to confirm';
      deleteAllTimer = setTimeout(() => {
        deleteAllConfirming = false;
        deleteAllChatsBtn.classList.remove('confirm');
        deleteAllChatsBtn.textContent = 'Delete all chats';
      }, 2600);
      return;
    }
    clearTimeout(deleteAllTimer);
    deleteAllConfirming = false;
    deleteAllChatsBtn.classList.remove('confirm');
    deleteAllChatsBtn.textContent = 'Delete all chats';
    settingsPanel.classList.remove('open');
    deleteAllChats();
  });

  function updateDebugModeBtn() {
    debugModeBtn.textContent = 'Debug mode: ' + (state.debugMode ? 'On' : 'Off');
    debugModeBtn.classList.toggle('primary', state.debugMode);
  }
  debugModeBtn.addEventListener('click', () => {
    state.debugMode = !state.debugMode;
    try { localStorage.setItem(DEBUG_MODE_KEY, state.debugMode ? '1' : '0'); } catch { /* ignore */ }
    updateDebugModeBtn();
    updateSendBtn();
  });

  sidebarCollapseBtn.addEventListener('click', () => {
    document.getElementById('app').classList.add('sidebar-collapsed');
  });
  sidebarExpandBtn.addEventListener('click', () => {
    document.getElementById('app').classList.remove('sidebar-collapsed');
  });

  /* ------------------------------ Composer --------------------------------- */

  function autoGrow() {
    composerInput.style.height = 'auto';
    composerInput.style.height = Math.min(200, composerInput.scrollHeight) + 'px';
  }
  composerInput.addEventListener('input', autoGrow);
  composerInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendOrStop();
    }
  });

  let currentGenWrap = null;

  function sendOrStop() {
    if (state.generating) {
      stopGenerating();
      return;
    }
    doSend();
  }
  sendBtn.addEventListener('click', sendOrStop);

  function stopGenerating() {
    // transformers.js doesn't expose a clean mid-stream abort, so the
    // reliable way to actually stop token generation (not just stop
    // *listening* to it) is to discard the worker producing it — same
    // recovery trick used when a model fails to load. The model is cached
    // by the browser after the first download, so reloading it into the
    // fresh worker is fast, not a re-download.
    state.stopRequested = true;
    worker.terminate();
    worker = makeWorker();
    state.pipelinesReady = {};
    pendingGen.clear();
    if (currentGenWrap && currentGenWrap._bubble) {
      currentGenWrap._bubble.textContent += ' [stopped]';
    }
    state.generating = false;
    updateSendBtn();
    ensureModel(state.modelKey).catch(() => {});
  }

  async function doSend() {
    const text = composerInput.value.trim();
    if (!text || state.generating) return;
    if (text.length > MAX_INPUT_LENGTH) {
      flashSendBtn('Message too long', 1600);
      return;
    }
    composerInput.value = '';
    autoGrow();

    state.messages.push({ role: 'user', content: text });
    addMessageBubble('user', text);
    renderMsgCount();
    persistCurrentChat();

    try {
      await ensureModel(state.modelKey);
    } catch (err) {
      const base = "Sorry — I couldn't load the AI model on this device.";
      const msg = (state.debugMode && err && err.message) ? `${base}\n\nDebug: ${err.message}` : base;
      addMessageBubble('assistant', msg, MODELS[state.modelKey].label);
      return;
    }

    const modelKeyAtStart = state.modelKey;
    const wireMessages = [{ role: 'system', content: SYSTEM_PROMPT }, ...state.messages.map((m) => ({ role: m.role, content: m.content }))];
    const genOpts = { max_new_tokens: MAX_NEW_TOKENS, temperature: 0.7, top_p: 0.9, do_sample: true };

    state.generating = true;
    state.stopRequested = false;
    state.genTokens = 0;
    state.genMaxTokens = estimateOutputTokens(wireMessages, MAX_NEW_TOKENS);
    state.genStartedAt = Date.now();
    updateSendBtn();

    const wrap = addMessageBubble('assistant', '', MODELS[modelKeyAtStart].label);
    currentGenWrap = wrap;
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    wrap._bubble.appendChild(cursor);
    let acc = '';

    try {
      const text = await runGenerate(modelKeyAtStart, wireMessages, genOpts, (chunk) => {
        acc += chunk;
        state.genTokens += 1;
        wrap._bubble.textContent = acc;
        wrap._bubble.appendChild(cursor);
        scrollToBottom();
        updateSendBtn();
      });
      if (!state.stopRequested) {
        const finalText = (text || acc || '').trim();
        cursor.remove();
        wrap._bubble.textContent = finalText || '(no response)';
        state.messages.push({ role: 'assistant', content: finalText, modelLabel: MODELS[modelKeyAtStart].label });
        renderMsgCount();
        persistCurrentChat();
      }
    } catch (err) {
      if (!state.stopRequested) {
        cursor.remove();
        console.error(err);
        const detail = (state.debugMode && err && err.message) ? ` (${err.message})` : '';
        wrap._bubble.textContent = acc ? acc + '\n\n[generation failed' + detail + ']' : 'Something went wrong generating a reply.' + detail;
      }
    } finally {
      currentGenWrap = null;
      state.generating = false;
      // Generation just used the model; the idle clock starts fresh from here
      // (the model may already have been unloaded by stopGenerating's own
      // worker swap, in which case there's nothing to arm a timer for).
      if (state.pipelinesReady[modelKeyAtStart]) resetIdleUnloadTimer();
      updateSendBtn();
    }
  }

  /* -------------------------------- Boot ------------------------------------ */

  initChats();
  renderModelOptions();
  renderThemes();
  updateDebugModeBtn();
  updateSendBtn();
  autoGrow();
  // Start fetching the default model in the background immediately, so Send
  // is usually instant by the time someone actually types something.
  ensureModel(state.modelKey).catch(() => {});
})();

</script>
</body>
</html>
